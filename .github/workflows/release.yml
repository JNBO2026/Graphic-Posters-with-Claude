# A GitHub Release for every new poster, so anyone watching the repo
# (Watch > Custom > Releases) gets GitHub's own notification and email.
name: Release new poster
on:
  push:
    paths: ['days/[0-9][0-9]/meta.json']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release any day without one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for meta in days/[0-9][0-9]/meta.json; do
            [ -e "$meta" ] || continue
            d=$(basename "$(dirname "$meta")")
            tag="day-$d"
            gh release view "$tag" >/dev/null 2>&1 && continue
            title=$(jq -r '.title' "$meta")
            {
              echo "$(jq -r '.note // ""' "$meta")"
              echo
              echo "**The prompt, as typed:**"
              echo
              sed 's/^/> /' "days/$d/prompt.md"
              echo
              echo "**How it was made:** $(jq -r '.process // "" | gsub("\\[\\[(?<n>[^\\]]+)\\]\\]"; .n)' "$meta")"
              echo
              if [ "$(jq '(.skills // []) | length' "$meta")" != "0" ]; then
                echo "**Skills used** (public, free to grab):"
                jq -r '.skills[] | "- [\(.name)](\(.url))"' "$meta"
                echo
              fi
              echo "See it on the wall and copy the prompt: $(grep -o "url: '[^']*'" site/site.config.js | cut -d"'" -f2)d/$d"
            } > notes.md
            files=("days/$d/poster.jpg#Day $d poster (A3)")
            [ -f "days/$d/poster.mp4" ] && files+=("days/$d/poster.mp4#Day $d poster, animated (MP4)")
            gh release create "$tag" "${files[@]}" --title "Day $d: $title" --notes-file notes.md --target "$GITHUB_SHA"
          done
