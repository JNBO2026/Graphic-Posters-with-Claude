<!doctype html>
<html lang="en-GB">
<head>
<!-- Code only. three.js 0.160 (vendor/, MIT). The word is projected onto every surface from one fixed eye, like a slide
     projector, in a custom shader: each surface asks where it lands in that eye's view and paints itself red if it falls
     inside the word. The camera walks away from that eye and back. Type: Archivo Black, Google Fonts, as the projected mask. -->
<meta charset="utf-8">
<title>Day 27: Here.</title>
<meta name="poster-motion" content="10">
<meta name="poster-motion-fps" content="30">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@600&display=block" rel="stylesheet">
<style>
  html, body { margin:0; width:1240px; height:1754px; overflow:hidden; background:#E8E3D8; }
  canvas { position:absolute; left:0; top:0; width:1240px; height:1754px; display:block; }
  .s { position:absolute; left:72px; right:72px; bottom:64px; font:600 44px/1.1 Archivo; color:#1A1917; letter-spacing:-.01em; }
</style>
</head>
<body>
<div class="s">It only lines up from one place.</div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
const W = 1240, H = 1754, LOOP = 10, dpr = window.devicePixelRatio || 1, TAU = Math.PI * 2;
await document.fonts.load('100px "Archivo Black"'); await document.fonts.load('600 44px Archivo');
// the word, as the projector's slide
const mc = document.createElement('canvas'); mc.width = 1240; mc.height = 1754; const m = mc.getContext('2d');
m.fillStyle = '#000'; m.fillRect(0, 0, 1240, 1754); m.fillStyle = '#fff'; m.font = '100px "Archivo Black"';
const mt = m.measureText('HERE'), sx = 1090 / (mt.actualBoundingBoxLeft + mt.actualBoundingBoxRight), sy = sx * 2.5;
m.save(); m.translate(75, 330); m.scale(sx, sy); m.fillText('HERE', mt.actualBoundingBoxLeft, mt.actualBoundingBoxAscent); m.restore();
const slide = new THREE.CanvasTexture(mc); slide.colorSpace = THREE.SRGBColorSpace;
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setPixelRatio(dpr); R.setSize(W, H);
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; R.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color('#E8E3D8');
const EYE = new THREE.Vector3(0, 10.5, 10.5), LOOK = new THREE.Vector3(0, .6, -1.2);
const eye = new THREE.PerspectiveCamera(34, W / H, .1, 100); eye.position.copy(EYE); eye.lookAt(LOOK); eye.updateMatrixWorld(); eye.updateProjectionMatrix();
const cam = new THREE.PerspectiveCamera(34, W / H, .1, 100);
const eyeVP = new THREE.Matrix4().multiplyMatrices(eye.projectionMatrix, eye.matrixWorldInverse);
// one material for every surface: plaster or paint, lit by a key light, with the word projected from the eye
const painted = base => new THREE.ShaderMaterial({
  uniforms: { slide: { value: slide }, VP: { value: eyeVP }, base: { value: new THREE.Color(base) }, L: { value: new THREE.Vector3(-.5, .85, .4).normalize() } },
  vertexShader: `varying vec3 wp; varying vec3 wn; void main() { vec4 w = modelMatrix * vec4(position, 1.); wp = w.xyz; wn = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform sampler2D slide; uniform mat4 VP; uniform vec3 base, L; varying vec3 wp; varying vec3 wn;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    void main() {
      vec4 c = VP * vec4(wp, 1.); vec2 uv = c.xy / c.w * .5 + .5;
      float on = (c.w > 0. && uv.x > 0. && uv.x < 1. && uv.y > 0. && uv.y < 1.) ? texture2D(slide, vec2(uv.x, uv.y)).r : 0.;
      vec3 paint = vec3(.84, .17, .11);
      vec3 col = mix(base, paint, smoothstep(.45, .55, on));
      float dif = .55 + .45 * max(dot(normalize(wn), L), 0.);
      col *= dif * (.97 + .05 * hash(floor(wp.xz * 60.) + floor(wp.y * 60.)));
      gl_FragColor = vec4(pow(col, vec3(1. / 2.2)), 1.);
    }` });
const add = (g, c, x, y, z, ry = 0) => { const o = new THREE.Mesh(g, painted(c)); o.position.set(x, y, z); o.rotation.y = ry; S.add(o); return o; };
// the room: floor, back wall, side wall, and a few things standing in it
const floor = add(new THREE.PlaneGeometry(30, 30), '#D9D3C6', 0, 0, 0); floor.rotation.x = -Math.PI / 2;
add(new THREE.PlaneGeometry(30, 16), '#E6E0D4', 0, 8, -6);
const side = add(new THREE.PlaneGeometry(30, 16), '#DCD5C8', -6.5, 8, 0, Math.PI / 2);
add(new THREE.BoxGeometry(3, 2.4, 2.4), '#CFC7B8', -2.6, 1.2, -1.4, .5);
add(new THREE.BoxGeometry(1.8, 5.2, 1.8), '#D6CFC1', 3.2, 2.6, -3.2, -.3);
add(new THREE.SphereGeometry(1.5, 64, 40), '#E1DACD', 1.4, 1.5, .9);
add(new THREE.CylinderGeometry(1, 1, 1.2, 48), '#D2CABB', -1.2, .6, 3.2);
add(new THREE.BoxGeometry(1.4, 1.4, 1.4), '#D8D1C3', 3.8, .7, 2.6, .8);
// the walk: away from the eye along a curve, then back, easing in and out so the snap is slow at both ends
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function draw(sec) {
  const t = ((sec % LOOP) + LOOP) % LOOP / LOOP;
  const k = t < .14 ? 0 : t < .5 ? ease((t - .14) / .36) : t < .62 ? 1 : t < .96 ? 1 - ease((t - .62) / .34) : 0;
  const a = k * 1.15;
  cam.position.set(EYE.x + Math.sin(a) * 11, EYE.y - k * 4.5, EYE.z - (1 - Math.cos(a)) * 5);
  cam.lookAt(LOOK.x - k * .8, LOOK.y + k * .8, LOOK.z); cam.updateMatrixWorld();
  R.render(S, cam);
}
draw(0); document.body.dataset.ready = '1';
window.__seek = async t => draw(t);
</script>
</body>
</html>
