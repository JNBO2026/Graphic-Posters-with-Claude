<!doctype html>
<html lang="en-GB">
<head>
<!-- Code only. A WebGL shader paints two colour fields after Rothko: each is built from twelve thin glazes, each glaze a
     soft rectangle with its own dry brushed edge (anisotropic noise), laid over a ground and a canvas weave. The glazes
     breathe on loops whose periods divide ten seconds, so the whole thing loops exactly. -->
<meta charset="utf-8">
<title>Day 29: Field.</title>
<meta name="poster-motion" content="10">
<meta name="poster-motion-fps" content="30">
<style>
  html, body { margin:0; width:1240px; height:1754px; overflow:hidden; background:#4A1A14; }
  canvas { position:absolute; left:0; top:0; width:1240px; height:1754px; display:block; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script>
const READY = (async () => {
  const W = 1240, H = 1754, LOOP = 10, dpr = window.devicePixelRatio || 1, PW = Math.round(W * dpr), PH = Math.round(H * dpr);
  const cv = document.getElementById('gl'); cv.width = PW; cv.height = PH;
  const gl = cv.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
  const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, `
precision highp float;
uniform float t, dpr, H;
const float TAU = 6.2831853;
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p) { float s = 0., a = .5; for (int i = 0; i < 5; i++) { s += a * noise(p); p = p * 2.07 + 3.1; a *= .5; } return s; }
// one glaze: a soft rectangle; its edge is scumbled (broad wander plus a dry, broken fringe), and the paint inside
// it is laid in wide brush wipes at the glaze's own angle, so each layer is thicker in some passages than others
float glaze(vec2 p, vec4 r, float soft, float seed, float br) {
  vec2 c = (r.xy + r.zw) * .5, hs = (r.zw - r.xy) * .5 * (1. + .012 * br);
  vec2 q = abs(p - c) - hs;
  float d = length(max(q, 0.)) + min(max(q.x, q.y), 0.);
  float wander = (fbm(p * .006 + seed) - .5) * soft * 2.4;
  float fringe = (noise(p * vec2(.25, .09) + seed * 7.) - .5) * soft * .9 * smoothstep(soft * 2.5, 0., abs(d));
  return 1. - smoothstep(-soft, soft, d + wander + fringe);
}
float wipes(vec2 p, float seed) {
  float an = hash(vec2(seed, 3.)) * 3.1416, cs = cos(an), sn = sin(an);
  vec2 q = mat2(cs, -sn, sn, cs) * p;
  return smoothstep(.25, .85, fbm(q * vec2(.0025, .016) + seed * 3.));
}
void main() {
  vec2 p = vec2(gl_FragCoord.x, H * dpr - gl_FragCoord.y) / dpr;
  float a = t * TAU;
  // the ground: a deep maroon, itself uneven
  vec3 col = vec3(.36, .10, .08) * (.82 + .3 * fbm(p * .004)) ;
  col = mix(col, vec3(.25, .06, .07), fbm(p * .0025 + 9.) * .5);
  // top field: orange red, twelve glazes; bottom field: a dusky violet over plum. Each glaze breathes on its own phase
  vec4 TOP = vec4(110., 120., 1130., 960.), BOT = vec4(120., 1050., 1120., 1636.);
  for (int i = 0; i < 12; i++) {
    float fi = float(i), ph = a * (fi < 6. ? 1. : 2.) + fi * 1.7;
    float br = sin(ph);
    float g = glaze(p, TOP + vec4(fi * 5. - 25., fi * 4. - 20., 25. - fi * 5., 20. - fi * 4.), 14. + fi * 4., fi * 1.3, br);
    vec3 c = mix(vec3(.93, .36, .12), vec3(.86, .18, .10), fract(fi * .37));
    c = mix(c, vec3(1., .62, .22), .18 * (.5 + .5 * sin(ph + 1.)));
    col = mix(col, c, g * (.10 + .22 * wipes(p, fi)));
  }
  for (int i = 0; i < 12; i++) {
    float fi = float(i), ph = a * (fi < 6. ? 1. : 2.) + fi * 2.3 + 2.;
    float br = sin(ph);
    float g = glaze(p, BOT + vec4(fi * 5. - 25., fi * 4. - 20., 25. - fi * 5., 20. - fi * 4.), 14. + fi * 4., fi * 1.1 + 40., br);
    vec3 c = mix(vec3(.40, .15, .36), vec3(.13, .05, .17), fract(fi * .53));
    c = mix(c, vec3(.45, .18, .32), .2 * (.5 + .5 * sin(ph)));
    col = mix(col, c, g * (.07 + .34 * wipes(p, fi + 20.)));
  }
  float core = glaze(p, vec4(300., 300., 940., 760.), 160., 77., sin(a));
  col = mix(col, vec3(.98, .52, .16), core * .22 * (.85 + .15 * sin(a)));
  // where the two fields nearly meet, the ground glows through: a thin warm seam
  float seam = exp(-pow((p.y - 1005.) / 34., 2.)) * smoothstep(80., 220., p.x) * smoothstep(1160., 1020., p.x);
  col += vec3(.20, .06, .02) * seam * (.7 + .3 * sin(a + 1.));
  // the canvas: a fine plain weave the paint sits on
  vec2 w = p * dpr / 2.6;
  float weave = .5 + .5 * (sin(w.x * TAU) * step(.5, fract(w.y * .5)) + sin(w.y * TAU) * (1. - step(.5, fract(w.y * .5))));
  col *= .94 + .06 * weave;
  col *= .97 + .05 * hash(floor(p * dpr));
  gl_FragColor = vec4(col, 1.);
}`));
  gl.linkProgram(pr); gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const ap = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(ap); gl.vertexAttribPointer(ap, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(pr, n);
  gl.uniform1f(U('dpr'), dpr); gl.uniform1f(U('H'), H); gl.viewport(0, 0, PW, PH);
  const draw = sec => { gl.uniform1f(U('t'), ((sec % LOOP) + LOOP) % LOOP / LOOP); gl.drawArrays(gl.TRIANGLES, 0, 3); };
  draw(0); document.body.dataset.ready = '1'; return draw;
})();
window.__seek = async t => { const draw = await READY; draw(t); };
</script>
</body>
</html>
