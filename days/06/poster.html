<!doctype html>
<html lang="en-GB">
<head>
<!-- frames/ is made from turntable.mp4 (Flora, Kling v4): ffmpeg -i turntable.mp4 -vf fps=30 -t 10 -q:v 2 frames/f%04d.jpg -->
<meta charset="utf-8">
<title>Day 06: bruh.</title>
<meta name="poster-motion" content="10">
<meta name="poster-motion-fps" content="30">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin:0; width:1240px; height:1754px; overflow:hidden; background:#4B22F0; }
  canvas { position:absolute; left:0; top:0; width:1240px; height:1754px; display:block; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script>
const READY = (async () => {
  const W = 1240, H = 1754, M = 72, LOOP = 10, FPS = 30, dpr = window.devicePixelRatio || 1, PW = Math.round(W * dpr), PH = Math.round(H * dpr);
  const FRAMES = window.FRAME_COUNT || 300, frame = i => `frames/f${String(i + 1).padStart(4, '0')}.jpg`;
  await Promise.all(['900 400px Unbounded', '500 22px "JetBrains Mono"', '700 22px "JetBrains Mono"'].map(f => document.fonts.load(f)));

  // ---------- The type layer: "bruh" across the middle, behind the rider, and the readouts round the edge ----------
  const tc = document.createElement('canvas'); tc.width = PW; tc.height = PH; const t = tc.getContext('2d'); t.scale(dpr, dpr);
  // a soft contact shadow where the wheels meet the ground, on the background, under everything
  const SHY = window.SHADOW_Y || 1330;
  const sg = t.createRadialGradient(W / 2, SHY, 0, W / 2, SHY, 420); sg.addColorStop(0, 'rgba(20,4,60,.55)'); sg.addColorStop(1, 'rgba(20,4,60,0)');
  t.save(); t.translate(W / 2, SHY); t.scale(1, .16); t.translate(-W / 2, -SHY); t.fillStyle = sg; t.fillRect(0, SHY - 420, W, 840); t.restore();
  t.fillStyle = '#FFF4E4'; t.textBaseline = 'alphabetic';
  t.font = '900 400px Unbounded'; t.letterSpacing = '-18px';
  const m = t.measureText('bruh'), gw = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, gh = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  const s = (W - 2 * M) / gw, cy = window.TYPE_Y || H * .5;
  t.save(); t.translate(M, cy - gh * s / 2); t.scale(s, s); t.fillText('bruh', m.actualBoundingBoxLeft, m.actualBoundingBoxAscent); t.restore();
  // the same word again as a hairline outline, laid over the rider, so it still reads where they cross it
  const oc = document.createElement('canvas'); oc.width = PW; oc.height = PH; const o = oc.getContext('2d'); o.scale(dpr, dpr);
  o.font = '900 400px Unbounded'; o.letterSpacing = '-18px'; o.textBaseline = 'alphabetic'; o.strokeStyle = '#FFF4E4'; o.lineJoin = 'round';
  o.save(); o.translate(M, cy - gh * s / 2); o.scale(s, s); o.lineWidth = 2.6 / s; o.strokeText('bruh', m.actualBoundingBoxLeft, m.actualBoundingBoxAscent); o.restore();
  t.letterSpacing = '1px';
  const lab = (a, b, x, y, align) => { t.textAlign = align; t.font = '700 22px "JetBrains Mono"'; t.fillText(a, x, y); t.font = '500 22px "JetBrains Mono"'; t.globalAlpha = .72; t.fillText(b, x, y + 30); t.globalAlpha = 1; };
  lab('THIRTY POSTERS', '06 / 30', M, M + 18, 'left');
  lab('LDN, E8', 'RIDE OUT', W - M, M + 18, 'right');
  lab('ANIME, ROTATING', 'ONE TURN EVERY 10 S', M, H - M - 30, 'left');
  lab('16.11.2026', 'DITHERED', W - M, H - M - 30, 'right');

  // ---------- WebGL: one pass keys the rider off the magenta, lays them over the type and background, then dithers the lot ----------
  const cv = document.getElementById('gl'); cv.width = PW; cv.height = PH;
  const LAYER = { bg: 1, type: 2, ride: 3, line: 4, grain: 5 }[new URLSearchParams(location.search).get('layer')] || 0;
  if (LAYER) document.documentElement.style.background = document.body.style.background = 'transparent';
  const gl = cv.getContext('webgl', { preserveDrawingBuffer: true, antialias: false, premultipliedAlpha: true, alpha: !!LAYER });
  const sh = (ty, src) => { const o = gl.createShader(ty); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, `attribute vec2 p; varying vec2 uv; void main(){ uv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, `
    precision highp float; varying vec2 uv; uniform sampler2D tRide, tType, tLine; uniform vec2 res; uniform vec4 box; uniform float cell; uniform int mode;
    float bay(vec2 p){ p = mod(floor(p), 8.); float v = 0., m = 1.;
      for (int i = 0; i < 3; i++) { float bx = mod(floor(p.x / m), 2.), by = mod(floor(p.y / m), 2.); v = v * 4. + (by * 2. + mod(bx + by, 2.)); m *= 2.; }
      return (v + .5) / 64.; }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 px = uv * res, cp = floor(px / cell), pu = vec2(uv.x, 1. - uv.y);
      // the background: electric violet into hot pink
      float g = pu.y * .9 + (1. - distance(pu, vec2(.5, .48)) * 1.5) * .1;
      vec3 col = mix(vec3(.29, .13, .94), vec3(1., .22, .58), smoothstep(.05, 1., g));
      vec4 ty = texture2D(tType, pu); col = mix(col, ty.rgb, ty.a);
      // the rider, keyed off magenta: how much more red and blue a pixel has than green
      vec2 ru = (pu - box.xy) / box.zw; float a = 0.; vec3 rc = vec3(0.);
      if (ru.x > 0. && ru.x < 1. && ru.y > 0. && ru.y < 1.) {
        rc = texture2D(tRide, ru).rgb; float mg = min(rc.r, rc.b) - rc.g;
        a = 1. - smoothstep(.24, .44, mg);
        float spill = max(0., min(rc.r, rc.b) - max(rc.g, .0) - .06); rc.r -= spill * .55; rc.b -= spill * .65;   // takes the magenta cast off white and skin
        a *= smoothstep(0., .015, ru.x) * smoothstep(0., .015, 1. - ru.x) * smoothstep(0., .015, ru.y) * smoothstep(0., .015, 1. - ru.y);
      }
      col = mix(col, rc, a);
      vec4 ln = texture2D(tLine, pu); col = mix(col, vec3(1., .957, .894), ln.a * a);   // the outline only shows where the rider covers the word
      // the dither: each channel quantised against an 8 x 8 Bayer matrix, the matrix shifted per channel so the grain breaks into colour like an old screen
      float lv = mix(3., 10., a);                                 // the background gets three levels a channel, the rider ten
      vec3 thr = vec3(bay(cp), bay(cp + vec2(3., 1.)), bay(cp + vec2(1., 5.)));
      vec3 q = floor(col * lv + thr) / lv;
      q += (hash(cp) - .5) * .03;                                  // fixed grain, so the loop doesn't shimmer
      // layer mode, for the Reel's exploded view: 1 background, 2 type, 3 rider, 4 outline, 5 the dither pattern on its own
      if (mode == 0) { gl_FragColor = vec4(q, 1.); return; }
      vec3 bgq = floor(mix(vec3(.29, .13, .94), vec3(1., .22, .58), smoothstep(.05, 1., g)) * 3. + thr) / 3. + (hash(cp) - .5) * .03;
      if (mode == 1) gl_FragColor = vec4(bgq, 1.);
      if (mode == 2) gl_FragColor = vec4(floor(ty.rgb * 10. + thr) / 10. * ty.a, ty.a);
      if (mode == 3) gl_FragColor = vec4((floor(rc * 10. + thr) / 10. + (hash(cp) - .5) * .03) * a, a);
      if (mode == 4) gl_FragColor = vec4(vec3(1., .957, .894) * ln.a, ln.a);
      if (mode == 5) { float d = step(.88, thr.r) * .85; gl_FragColor = vec4(vec3(1.) * d, d); }
    }`));
  gl.linkProgram(pr); gl.useProgram(pr);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const lp = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp, 2, gl.FLOAT, false, 0, 0);
  const mk = (unit, src) => { const tx = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tx);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (src) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src); return tx; };
  const rideTex = mk(0, null); mk(1, tc); mk(2, oc);
  gl.uniform1i(gl.getUniformLocation(pr, 'tRide'), 0); gl.uniform1i(gl.getUniformLocation(pr, 'tType'), 1); gl.uniform1i(gl.getUniformLocation(pr, 'tLine'), 2);
  gl.uniform1i(gl.getUniformLocation(pr, 'mode'), LAYER); gl.uniform2f(gl.getUniformLocation(pr, 'res'), PW, PH); gl.uniform1f(gl.getUniformLocation(pr, 'cell'), 2 * dpr);
  // where the video sits on the page, as fractions: centred, as wide as the margins allow
  const B = window.RIDE_BOX || { x: 72, y: 330, w: 1096, h: 1096 };
  gl.uniform4f(gl.getUniformLocation(pr, 'box'), B.x / W, B.y / H, B.w / W, B.h / H);
  gl.viewport(0, 0, PW, PH);

  const img = new Image(); let shown = -1;
  async function draw(sec) {
    const f = ((Math.round(sec * FPS) % FRAMES) + FRAMES) % FRAMES;
    if (f !== shown) { img.src = frame(f); await img.decode(); shown = f; gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, rideTex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img); }
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish();
  }
  await draw(0);
  document.body.dataset.ready = '1';
  return draw;
})();
window.__seek = async t => { const draw = await READY; await draw(t); };
</script>
</body>
</html>
