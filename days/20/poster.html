<!doctype html>
<html lang="en-GB">
<head>
<!-- Code only. buttons.json: every button label on 40 real iOS screens found through the Mobbin MCP, read and counted by hand.
     Each label is drawn as the kind of button it was: filled (go on) or outlined (let me off), sized by its count.
     Type: Inter Tight, Google Fonts. HTML and CSS; a CSS animation presses the buttons. -->
<meta charset="utf-8">
<title>Day 20: Not Now.</title>
<meta name="poster-motion" content="10">
<meta name="poster-motion-fps" content="30">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&display=block" rel="stylesheet">
<style>
  html, body { margin:0; width:1240px; height:1754px; overflow:hidden; background:#EFEAE0; font-family:'Inter Tight'; }
  #wall { perspective:1400px; }
  #wall { position:absolute; left:72px; right:72px; top:72px; bottom:300px; display:flex; flex-wrap:wrap; align-content:flex-start; gap:22px 14px; }
  .b { display:inline-flex; align-items:center; justify-content:center; border-radius:999px; font-weight:600; letter-spacing:-.02em; white-space:nowrap; box-sizing:border-box;
       animation:press 10s cubic-bezier(.2,.7,.2,1) infinite; }
  .go { background:#2638C9; color:#F6F3EC; box-shadow:0 10px 0 #17227C, 0 18px 30px rgba(23,34,124,.25); }
  .no { background:#EFEAE0; color:#D4532A; box-shadow:inset 0 0 0 4px #D4532A, 0 10px 0 #E7D9C9; }
  .n { font-weight:700; opacity:.45; margin-left:.4em; font-variant-numeric:tabular-nums; }
  @keyframes press { 0%, 100% { transform:scale(1); } }
  .k { position:absolute; left:72px; right:72px; bottom:72px; font:700 66px/1 'Inter Tight'; letter-spacing:-.035em; color:#2638C9; }
  .k span { color:#D4532A; }
  #cur { position:absolute; left:0; top:0; width:96px; height:96px; pointer-events:none; z-index:9; filter:drop-shadow(0 6px 8px rgba(0,0,0,.25)); }
  .ripple { position:absolute; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; border:4px solid #D4532A; pointer-events:none; z-index:8; opacity:0; }
</style>
</head>
<body>
<div id="wall"></div>
<div class="k">40 app screens. 45 times<br>they asked. <span>25 times you<br>could say not yet.</span></div>
<script>
(async () => {
  const D = await (await fetch('buttons.json')).json(), wall = document.getElementById('wall');
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  // height and type by count: the tie at the top gets the most room
  const make = K => { wall.innerHTML = ''; D.labels.forEach((l, i) => {
    const h = Math.round((18 + l.count * 30) * K), fs = Math.round(h * .42);
    const el = document.createElement('div'); el.className = 'b ' + (l.kind === 'decline' ? 'no' : 'go');
    el.style.height = h + 'px'; el.style.fontSize = fs + 'px'; el.style.padding = `0 ${Math.round(h * .45)}px`;
    if (l.kind === 'decline') el.style.boxShadow = `inset 0 0 0 ${Math.max(2, Math.round(h * .035))}px #D4532A, 0 ${Math.round(h * .08)}px 0 #E7D9C9`;
    else el.style.boxShadow = `0 ${Math.round(h * .08)}px 0 #17227C, 0 ${Math.round(h * .14)}px ${Math.round(h * .25)}px rgba(23,34,124,.22)`;
    el.innerHTML = `${cap(l.label)}<span class="n">${l.count}</span>`;
    // a thumb works down the list, pressing each one in turn; the two that tie are pressed last and longest
    const at = Math.min(8.4, 1 + i * .22), name = 'p' + i;
    const css = document.createElement('style');
    css.textContent = `@keyframes ${name} { 0%, ${(at * 10).toFixed(1)}% { transform:scale(1); } ${(at * 10 + 1.2).toFixed(1)}% { transform:scale(.94); } ${(at * 10 + 4).toFixed(1)}%, 100% { transform:scale(1); } }`;
    document.head.appendChild(css); el.style.animationName = name;
    wall.appendChild(el);
  });
  // the tie: Next and Not now share the first row, each half the width
  const [a, b] = wall.children; a.style.width = b.style.width = 'calc(50% - 7px)'; a.style.padding = b.style.padding = '0'; };
  await document.fonts.ready;
  // shrink everything together until the whole count fits the page
  let K = 2.6; make(K); while (wall.scrollHeight > wall.clientHeight + 1 && K > .3) { K -= .02; make(K); }
  // the thumb: a cursor that travels from button to button and taps each one; the press sinks in 3D, a ring blooms
  [...wall.children].forEach(b => { b.style.animation = 'none'; b.style.transformOrigin = '50% 100%'; });
  const cur = document.createElement('div'); cur.id = 'cur';
  cur.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z" fill="#121212" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  document.body.appendChild(cur);
  const rip = document.createElement('div'); rip.className = 'ripple'; document.body.appendChild(rip);
  const bs = [...wall.children].slice(0, 9), at = i => { const r = bs[i].getBoundingClientRect(); return [r.left + r.width * .62, r.top + r.height * .58]; };
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  window.__seek = t => {
    t = ((t % 10) + 10) % 10; const STEP = 10 / bs.length, i = Math.floor(t / STEP), u = (t - i * STEP) / STEP, j = (i + 1) % bs.length;
    const [ax, ay] = at(i), [bx, by] = at(j), m = ease(Math.min(1, Math.max(0, (u - .45) / .5)));
    // arc between buttons, the way a thumb lifts
    const px = ax + (bx - ax) * m, py = ay + (by - ay) * m - Math.sin(m * Math.PI) * 120;
    cur.style.transform = `translate(${px - 10}px, ${py - 6}px) scale(${u < .18 ? .82 + u : 1})`;
    bs.forEach((b, k) => { const press = k === i ? Math.max(0, 1 - Math.abs(u - .1) / .12) : 0;
      b.style.transform = `translateY(${press * 7}px) rotateX(${press * 14}deg) scale(${1 - press * .03})`; });
    const ru = Math.max(0, u - .08) / .4; rip.style.left = ax + 'px'; rip.style.top = ay + 'px';
    rip.style.opacity = ru > 0 && ru < 1 ? (1 - ru) : 0; rip.style.transform = `scale(${1 + ru * 9})`;
  };
  window.__seek(0);
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
