<!doctype html>
<html lang="en-GB">
<head>
<!-- path.json is made by line.py and mend.py (Python, NumPy): a CC0 photo stippled with Lloyd's algorithm and joined into
     one travelling salesman tour. Here, with three.js 0.160 (vendor/, MIT), that tour becomes one continuous wire in 3D:
     the darker the photo at a point, the further the wire comes towards you. Seen straight on it is the picture; as the
     camera swings round, the picture opens into relief. Colour runs along the wire's length, indigo to rose. -->
<meta charset="utf-8">
<title>Day 14: One Line.</title>
<meta name="poster-motion" content="10">
<meta name="poster-motion-fps" content="30">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=block" rel="stylesheet">
<style>
  html, body { margin:0; width:1240px; height:1754px; overflow:hidden; background:#F1ECE2; }
  canvas { position:absolute; left:0; top:0; width:1240px; height:1754px; display:block; }
</style>
</head>
<body>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
const W = 1240, H = 1754, LOOP = 10, dpr = window.devicePixelRatio || 1, TAU = Math.PI * 2;
const { points: P } = await (await fetch('path.json')).json();
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setPixelRatio(dpr); R.setSize(W, H);
R.outputColorSpace = THREE.SRGBColorSpace; document.body.prepend(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color('#F1ECE2');
const FOV = 16, DIST = (H / 2) / Math.tan(FOV / 2 * Math.PI / 180);
const cam = new THREE.PerspectiveCamera(FOV, W / H, 10, DIST * 3);
// the wire: every point of the tour, pulled forward by how dark the photo is there
const pts = P.map(([x, y, k]) => new THREE.Vector3(x - W / 2, H / 2 - y, (k || 0) * 160));
const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', .5);
const SEG = pts.length * 2, geo = new THREE.TubeGeometry(curve, SEG, 2.6, 5, false);
// colour by depth: an analogous run, deep indigo where the wire comes closest, rose where it lies back
const cols = [], A = new THREE.Color('#23286B'), B = new THREE.Color('#7A2E8E'), C = new THREE.Color('#D9506A');
const n = geo.attributes.position.count, ring = 6;
const pos = geo.attributes.position;
for (let i = 0; i < n; i++) { const u = Math.min(1, Math.max(0, 1 - pos.getZ(i) / 150)); const c = u < .5 ? A.clone().lerp(B, u * 2) : B.clone().lerp(C, (u - .5) * 2); cols.push(c.r, c.g, c.b); }
geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
const wire = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .45, metalness: .1 })); S.add(wire);
// a soft shadow of the wire on the paper behind it, so the relief reads even straight on
const shadow = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: '#1A1630', transparent: true, opacity: .1 }));
shadow.position.set(10, -12, -60); shadow.scale.set(1, 1, 0); S.add(shadow);
S.add(new THREE.HemisphereLight('#FFFFFF', '#B8A99A', 1.4));
const key = new THREE.DirectionalLight('#FFF3E6', 2.2); key.position.set(-1, 1.4, 1.2); S.add(key);
// the pen: a bright bead travelling the whole length once a loop, leaving the wire lit behind it
const pen = new THREE.Mesh(new THREE.SphereGeometry(14, 24, 16), new THREE.MeshBasicMaterial({ color: '#FFB547' })); S.add(pen);
const halo = new THREE.Mesh(new THREE.SphereGeometry(34, 24, 16), new THREE.MeshBasicMaterial({ color: '#FFB547', transparent: true, opacity: .25 })); S.add(halo);
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function draw(sec) {
  const t = ((sec % LOOP) + LOOP) % LOOP / LOOP;
  // straight on for the first second (the picture), swing round to show the relief, swing back
  const swing = t < .1 ? 0 : t < .5 ? ease((t - .1) / .4) : t < .6 ? 1 : t < .95 ? 1 - ease((t - .6) / .35) : 0;
  const yaw = swing * .62, pitch = swing * .18;
  cam.position.set(Math.sin(yaw) * DIST, Math.sin(pitch) * DIST, Math.cos(yaw) * Math.cos(pitch) * DIST);
  cam.lookAt(0, 0, 60 * swing); cam.zoom = 1 - swing * .06; cam.updateProjectionMatrix();
  const q = curve.getPointAt(t); pen.position.copy(q); halo.position.copy(q); halo.scale.setScalar(1 + .25 * Math.sin(t * TAU * 24));
  R.render(S, cam);
}
draw(0); document.body.dataset.ready = '1';
window.__seek = async t => draw(t);
</script>
</body>
</html>
