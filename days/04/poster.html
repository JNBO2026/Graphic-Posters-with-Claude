<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Day 04: Resolution.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
  html, body { margin:0; width:1240px; height:1754px; overflow:hidden; background:#F3F1EA; }
  canvas { position:absolute; left:0; top:0; width:1240px; height:1754px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="car.js"></script>
<script>
(async () => {
  // ---------- The page: a 50 / 50 split. RESOL over UTION, ten letters filling it edge to edge ----------
  const W = 1240, H = 1754, M = 40, BAND = 44, GAP = 10, dpr = window.devicePixelRatio || 1;
  const IW = W - 2 * M, RH = (H - 2 * M - BAND) / 2, TOP = M, BOT = M + RH + BAND; // image width, row height, the two rows
  const PAPER = '#F3F1EA', INK = '#0C0C0C', RED = '#F0320F';
  const CELL = .5, Z = 8;              // one dot per half pixel up top; the close up shows the same dots 8 times larger
  const GW = IW / CELL, GH = Math.round(RH / CELL);
  await Promise.all(['400 200px Anton', '400 13px "JetBrains Mono"', '600 13px "JetBrains Mono"'].map(f => document.fonts.load(f)));

  // ---------- Stippling: every dot is on or off. Error diffusion places them, a little noise keeps them from lining up ----------
  const img = new Image(); img.src = window.CAR; await img.decode();
  const sc = document.createElement('canvas'); sc.width = GW; sc.height = GH; const sx = sc.getContext('2d', { willReadFrequently: true });
  const k = Math.max(GW / img.width, GH / img.height), dw = img.width * k, dh = img.height * k;
  sx.drawImage(img, (GW - dw) / 2, (GH - dh) / 2, dw, dh);
  const src = sx.getImageData(0, 0, GW, GH).data, g = new Float32Array(GW * GH);
  for (let i = 0; i < g.length; i++) { let v = src[i * 4] / 255; v = Math.pow(v, .82); g[i] = Math.min(1, v * 1.04); } // open the shadows a touch so black areas keep some grain
  let seed = 404; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const on = new Uint8Array(GW * GH); let dots = 0;
  for (let y = 0; y < GH; y++) { const ltr = y % 2 === 0; // serpentine, so the grain has no direction
    for (let n = 0; n < GW; n++) { const x = ltr ? n : GW - 1 - n, i = y * GW + x, v = g[i];
      const white = v > .5 + (rnd() - .5) * .28, e = v - (white ? 1 : 0), d = ltr ? 1 : -1;
      if (!white) { on[i] = 1; dots++; }
      if (x + d >= 0 && x + d < GW) g[i + d] += e * 7 / 16;
      if (y + 1 < GH) { if (x - d >= 0 && x - d < GW) g[i + GW - d] += e * 3 / 16; g[i + GW] += e * 5 / 16; if (x + d >= 0 && x + d < GW) g[i + GW + d] += e * 1 / 16; } } }

  // ---------- The art: the whole car above, the same dots close up below ----------
  const art = document.createElement('canvas'); art.width = Math.round(W * dpr); art.height = Math.round(H * dpr);
  const a = art.getContext('2d'); a.scale(dpr, dpr);
  // A: every dot, one per half pixel. At this size it reads as a photograph
  const bm = document.createElement('canvas'); bm.width = GW; bm.height = GH; const bx = bm.getContext('2d'), bd = bx.createImageData(GW, GH);
  for (let i = 0; i < on.length; i++) if (on[i]) { bd.data[i * 4] = bd.data[i * 4 + 1] = bd.data[i * 4 + 2] = 12; bd.data[i * 4 + 3] = 255; }
  bx.putImageData(bd, 0, 0);
  a.imageSmoothingEnabled = dpr !== 2; a.imageSmoothingQuality = 'high';
  a.drawImage(bm, M, TOP, IW, RH);
  // B: the dots inside the red frame, drawn round and 8 times the size, each nudged a hair like a pen would
  const F = window.FOCUS || { x: .2, y: .5 };
  const cw = Math.round(IW / (CELL * Z)), ch = Math.ceil(RH / (CELL * Z)), step = CELL * Z;
  const fx = Math.round(Math.min(GW - cw, Math.max(0, F.x * GW - cw / 2))), fy = Math.round(Math.min(GH - ch, Math.max(0, F.y * GH - ch / 2)));
  a.fillStyle = INK; a.save(); a.beginPath(); a.rect(M, BOT, IW, RH); a.clip();
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) { if (!on[(fy + y) * GW + fx + x]) continue;
    a.beginPath(); a.arc(M + (x + .5) * step + (rnd() - .5) * .9, BOT + (y + .5) * step + (rnd() - .5) * .9, 1.62 + rnd() * .34, 0, 6.2832); a.fill(); }
  a.restore();

  // ---------- The type: RESOLUTION masks the image. Each letter is fitted to its own cell so the word fills the page ----------
  const mask = document.createElement('canvas'); mask.width = art.width; mask.height = art.height; const m = mask.getContext('2d'); m.scale(dpr, dpr);
  m.font = '400 200px Anton'; m.textBaseline = 'alphabetic'; m.fillStyle = '#000';
  const LW = (IW - 4 * GAP) / 5;
  ['RESOL', 'UTION'].forEach((row, r) => [...row].forEach((chr, i) => { const t = m.measureText(chr), gw = t.actualBoundingBoxLeft + t.actualBoundingBoxRight, gh = t.actualBoundingBoxAscent + t.actualBoundingBoxDescent;
    m.save(); m.translate(M + i * (LW + GAP), r ? BOT : TOP); m.scale(LW / gw, RH / gh); m.fillText(chr, t.actualBoundingBoxLeft, t.actualBoundingBoxAscent); m.restore(); }));

  const cv = document.getElementById('c'); cv.width = art.width; cv.height = art.height; const x = cv.getContext('2d');
  x.fillStyle = PAPER; x.fillRect(0, 0, cv.width, cv.height);
  // a ghost of the image outside the letters, so the car still holds together across the gaps
  x.globalAlpha = window.GHOST ?? .1; x.drawImage(art, 0, 0); x.globalAlpha = 1;
  a.setTransform(1, 0, 0, 1, 0, 0); a.globalCompositeOperation = 'destination-in'; a.drawImage(mask, 0, 0);
  x.drawImage(art, 0, 0);
  x.scale(dpr, dpr);

  // ---------- The key: where the close up comes from, and what you're looking at ----------
  const rx = M + fx * CELL, ry = TOP + fy * CELL, rw = cw * CELL, rh = RH / Z;
  x.strokeStyle = RED; x.lineWidth = 2; x.strokeRect(rx, ry, rw, rh);
  x.fillStyle = RED; x.fillRect(rx - 1, ry - 19, 22, 19);
  x.font = '600 13px "JetBrains Mono"'; x.textBaseline = 'alphabetic'; x.fillStyle = PAPER; x.textAlign = 'center'; x.fillText('B', rx + 10, ry - 5);
  const by = M + RH + BAND / 2 + 5, t = (s, X, align, col = INK, wt = 400) => { x.font = `${wt} 13px "JetBrains Mono"`; x.textAlign = align; x.fillStyle = col; x.fillText(s, X, by); };
  t('A', M, 'left', RED, 600); t(`THE WHOLE CAR, ${dots.toLocaleString('en-GB')} DOTS`, M + 22, 'left');
  t('THIRTY POSTERS  04 / 30  14.11.2026', W / 2, 'center', 'rgba(12,12,12,.6)');
  t('THE SAME DOTS, 8 TIMES CLOSER', W - M - 22, 'right'); t('B', W - M, 'right', RED, 600);
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
