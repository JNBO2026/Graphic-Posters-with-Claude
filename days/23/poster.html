<!doctype html>
<html lang="en-GB">
<head>
<!-- Code only. A spectral ray tracer in JavaScript on canvas: a white beam is split into 160 wavelengths from 400 to 700 nm,
     each refracted through a turning glass prism by Snell's law with a Cauchy index (flint glass), each drawn in the colour
     the eye sees for that wavelength (CIE 1931 fit), added together as light. Type: Space Grotesk, Google Fonts. -->
<meta charset="utf-8">
<title>Day 23: Spectrum.</title>
<meta name="poster-motion" content="10">
<meta name="poster-motion-fps" content="30">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin:0; width:1240px; height:1754px; overflow:hidden; background:#07070A; }
  canvas { position:absolute; left:0; top:0; width:1240px; height:1754px; display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const READY = (async () => {
  const W = 1240, H = 1754, M = 72, LOOP = 10, dpr = window.devicePixelRatio || 1;
  await Promise.all(['700 100px "Space Grotesk"', '500 40px "Space Grotesk"'].map(f => document.fonts.load(f)));
  const cv = document.getElementById('c'); cv.width = W * dpr; cv.height = H * dpr; const x = cv.getContext('2d');
  // the eye: CIE 1931 colour matching, by the multi-lobe Gaussian fit (Wyman, Sloan and Shirley, 2013), then XYZ to linear sRGB
  const g = (l, m, s1, s2) => { const t = (l - m) / (l < m ? s1 : s2); return Math.exp(-.5 * t * t); };
  const xyz = l => [1.056 * g(l, 599.8, 37.9, 31) + .362 * g(l, 442, 16, 26.7) - .065 * g(l, 501.1, 20.4, 26.2),
                    .821 * g(l, 568.8, 46.9, 40.5) + .286 * g(l, 530.9, 16.3, 31.1),
                    1.217 * g(l, 437, 11.8, 36) + .681 * g(l, 459, 26, 13.8)];
  const rgb = ([X, Y, Z]) => [3.2406 * X - 1.5372 * Y - .4986 * Z, -.9689 * X + 1.8758 * Y + .0415 * Z, .0557 * X - .204 * Y + 1.057 * Z];
  const N = 160, LAMS = Array.from({ length: N }, (_, i) => 400 + 300 * (i + .5) / N);
  const COLS = LAMS.map(l => rgb(xyz(l)).map(v => Math.max(0, v)));
  const norm = [0, 1, 2].map(k => COLS.reduce((s, c) => s + c[k], 0));          // so the beam in is white
  // flint glass: n(λ) = A + B / λ² (λ in µm), pushed a little so the fan is wide
  const n = l => 1.46 + .0120 / Math.pow(l / 1000, 2) * 4.2;
  // geometry
  const add = (a, b) => [a[0] + b[0], a[1] + b[1]], sub = (a, b) => [a[0] - b[0], a[1] - b[1]], mul = (a, s) => [a[0] * s, a[1] * s], dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  const nrm = a => { const l = Math.hypot(a[0], a[1]); return [a[0] / l, a[1] / l]; };
  const refract = (d, nv, eta) => { let c = -dot(d, nv); if (c < 0) { nv = mul(nv, -1); c = -c; } const k = 1 - eta * eta * (1 - c * c); return k < 0 ? null : add(mul(d, eta), mul(nv, eta * c - Math.sqrt(k))); };
  const hitSeg = (o, d, a, b) => { const e = sub(b, a), den = d[0] * e[1] - d[1] * e[0]; if (Math.abs(den) < 1e-9) return null;
    const w = sub(a, o), t = (w[0] * e[1] - w[1] * e[0]) / den, u = (w[0] * d[1] - w[1] * d[0]) / den; return t > 1e-6 && u >= 0 && u <= 1 ? t : null; };
  const PC = [W * .26, H * .24], PR = 200;
  function prism(ang) { return [0, 1, 2].map(k => { const a = ang + k * 2 * Math.PI / 3 - Math.PI / 2; return [PC[0] + PR * Math.cos(a), PC[1] + PR * Math.sin(a)]; }); }
  // trace one wavelength from the source through the prism and on to the edge of the page
  let BEAM = .30;
  function trace(P, lam) {
    // the beam arrives from the left, aimed at the middle of the prism's left face
    const fc = [(P[0][0] + P[2][0]) / 2, (P[0][1] + P[2][1]) / 2];
    let o = [-60, fc[1] - (fc[0] + 60) * Math.tan(BEAM)], d = nrm([Math.cos(BEAM), Math.sin(BEAM)]), inside = false, path = [o];
    for (let bounce = 0; bounce < 6; bounce++) {
      let best = null, bi = -1;
      for (let k = 0; k < 3; k++) { const t = hitSeg(o, d, P[k], P[(k + 1) % 3]); if (t !== null && (best === null || t < best)) { best = t; bi = k; } }
      if (best === null) { path.push(add(o, mul(d, 4000))); return path; }
      const hp = add(o, mul(d, best)), e = sub(P[(bi + 1) % 3], P[bi]); const nv = nrm([e[1], -e[0]]);
      const eta = inside ? n(lam) : 1 / n(lam), r = refract(d, nv, eta);
      path.push(hp); o = hp;
      if (!r) { d = sub(d, mul(nv, 2 * dot(d, nv))); }                // total internal reflection
      else { d = nrm(r); inside = !inside; }
    }
    return path;
  }
  // light accumulates in a float buffer, so overlapping wavelengths add up to white the way light does
  const LW = 620, LH = 877, S = LW / W, acc = new Float32Array(LW * LH * 3);
  const splat = (px, py, c, a) => { const i = Math.floor(px * S), j = Math.floor(py * S); if (i < 0 || j < 0 || i >= LW || j >= LH) return; const k = (j * LW + i) * 3; acc[k] += c[0] * a; acc[k + 1] += c[1] * a; acc[k + 2] += c[2] * a; };
  const lc = document.createElement('canvas'); lc.width = LW; lc.height = LH; const lx = lc.getContext('2d'); const img = lx.createImageData(LW, LH);
  const blur = document.createElement('canvas'); blur.width = LW; blur.height = LH; const bx = blur.getContext('2d');
  function draw(sec) {
    const t = ((sec % LOOP) + LOOP) % LOOP / LOOP;
    const ang = Math.PI / 6 + .16 + .10 * Math.sin(t * Math.PI * 2);       // apex up; the prism rocks and the spectrum sweeps
    BEAM = .24 + .05 * Math.sin(t * Math.PI * 2 + 1);
    const P = prism(ang);
    acc.fill(0);
    LAMS.forEach((lam, li) => {
      const c = [COLS[li][0] / norm[0], COLS[li][1] / norm[1], COLS[li][2] / norm[2]];
      for (let s = -3; s <= 3; s++) {                                 // the beam has width: seven parallel rays
        const path = trace(P, lam).map(p => [p[0] - s * 2.4 * Math.sin(BEAM), p[1] + s * 2.4 * Math.cos(BEAM)]);
        for (let q = 0; q < path.length - 1; q++) {
          const a = path[q], b = path[q + 1], L = Math.hypot(b[0] - a[0], b[1] - a[1]), steps = Math.ceil(L * S * 1.5);
          const after = q >= 2;                                         // once out of the glass, the beam spreads and fades with distance
          for (let k = 0; k < steps; k++) { const u = k / steps; const px = a[0] + (b[0] - a[0]) * u, py = a[1] + (b[1] - a[1]) * u;
            const fall = after ? Math.max(.35, 1 - u * .4) : 1;
            splat(px, py, c, (q === 0 ? 1.1 : 1.6) * fall / 7); }
        }
      }
    });
    const d = img.data, EXP = 34;
    for (let i = 0; i < LW * LH; i++) { for (let k = 0; k < 3; k++) { const v = 1 - Math.exp(-acc[i * 3 + k] * EXP); d[i * 4 + k] = Math.pow(v, 1 / 2.2) * 255; } d[i * 4 + 3] = 255; }
    lx.putImageData(img, 0, 0);
    x.setTransform(dpr, 0, 0, dpr, 0, 0); x.fillStyle = '#07070A'; x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'lighter';
    bx.clearRect(0, 0, LW, LH); bx.filter = 'blur(14px)'; bx.drawImage(lc, 0, 0); bx.filter = 'none';
    x.globalAlpha = .55; x.drawImage(blur, 0, 0, W, H); x.globalAlpha = 1;            // glow, like dust in a dark room
    x.imageSmoothingQuality = 'high'; x.drawImage(lc, 0, 0, W, H);
    // dust in the dark room: motes drift slowly and only show where they pass through light, coloured by it
    for (let i = 0; i < 700; i++) { const sx = (Math.sin(i * 12.9898) * 43758.5453 % 1 + 1) % 1, sy = (Math.sin(i * 78.233) * 12345.678 % 1 + 1) % 1;
      const mx = (sx * W + Math.sin(t * 6.283 + i) * 18 + t * 40) % W, my = (sy * H + t * 60 + Math.cos(t * 6.283 * 2 + i) * 10) % H;
      const k = (Math.floor(my * S) * LW + Math.floor(mx * S)) * 4, lr = d[k] / 255, lg = d[k + 1] / 255, lb = d[k + 2] / 255, L = (lr + lg + lb) / 3;
      if (L < .08) continue; const sz = 1.2 + (i % 5) * .5;
      x.fillStyle = `rgba(${Math.min(255, lr * 300)},${Math.min(255, lg * 300)},${Math.min(255, lb * 300)},${Math.min(1, L * 1.4)})`;
      x.beginPath(); x.arc(mx, my, sz, 0, Math.PI * 2); x.fill(); }
    x.globalCompositeOperation = 'source-over';
    // the glass: a pale edge and a faint fill
    x.beginPath(); x.moveTo(...P[0]); x.lineTo(...P[1]); x.lineTo(...P[2]); x.closePath();
    x.fillStyle = 'rgba(200,215,235,.07)'; x.fill(); x.strokeStyle = 'rgba(220,232,250,.55)'; x.lineWidth = 2; x.stroke();
    x.fillStyle = '#ECEBE6'; x.font = '700 150px "Space Grotesk"'; x.letterSpacing = '-4px'; x.textBaseline = 'alphabetic';
    x.fillText('Spectrum', M, H - M - 70);
    // a ruler of wavelengths up the right edge, ticked every 50 nm, the colour of each mark its own wavelength
    x.save(); x.font = '500 38px "Space Grotesk"'; x.textAlign = 'right';
    for (let l = 400; l <= 700; l += 50) { const yy = M + 120 + (l - 400) / 300 * (H * .5); const c0 = rgb(xyz(l)).map(v => Math.max(0, v)), mx = Math.max(...c0, .001), c = c0.map(v => .12 + .88 * v / mx);   // every mark as bright as its hue allows
      x.fillStyle = `rgb(${c.map(v => Math.round(Math.pow(v, 1 / 2.2) * 255)).join(',')})`; x.fillRect(W - M - 40, yy - 2, 40, 4); x.fillText(l + ' nm', W - M - 54, yy + 13); }
    x.restore();
    x.font = '500 40px "Space Grotesk"'; x.letterSpacing = '0px'; x.fillStyle = '#8E8C86';
    x.fillText('400 to 700 nanometres, one beam.', M + 4, H - M);
  }
  draw(0); document.body.dataset.ready = '1'; return draw;
})();
window.__seek = async t => { const draw = await READY; draw(t); };
</script>
</body>
</html>
