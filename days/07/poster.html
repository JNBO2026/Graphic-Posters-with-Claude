<!doctype html>
<html lang="en-GB">
<head>
<!-- Code only. culture.png is grown by culture.py (a Gray-Scott reaction-diffusion simulation in numpy): python3 -I days/07/culture.py -->
<meta charset="utf-8">
<title>Day 07: Culture.</title>
<meta name="poster-motion" content="10">
<meta name="poster-motion-fps" content="30">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  html, body { margin:0; width:1240px; height:1754px; overflow:hidden; background:#0B0C0B; }
  canvas { position:absolute; left:0; top:0; width:1240px; height:1754px; display:block; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fg"></canvas>
<script>
const READY = (async () => {
  const W = 1240, H = 1754, M = 72, LOOP = 10, dpr = window.devicePixelRatio || 1, PW = Math.round(W * dpr), PH = Math.round(H * dpr);
  // the dish: centred on the right edge, so half of it is off the page
  const CX = W, CY = H / 2, RA = H / 2 - M - 14, RG = RA + 16;
  await Promise.all(['600 100px "Inter Tight"', '400 13px "IBM Plex Mono"', '500 13px "IBM Plex Mono"'].map(f => document.fonts.load(f)));
  const img = new Image(); img.src = 'culture.png'; await img.decode();

  // ---------- The plate: WebGL, one pass ----------
  const cv = document.getElementById('gl'); cv.width = PW; cv.height = PH;
  const gl = cv.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, `
precision highp float;
uniform sampler2D cult; uniform float t, dpr; uniform vec2 C; uniform float RA, RG, H;
const float TAU = 6.2831853;
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p) { float s = 0., a = .5; for (int i = 0; i < 5; i++) { s += a * noise(p); p = p * 2.03 + 7.1; a *= .5; } return s; }
// loop: everything that moves goes round a circle in its own space, so frame 0 and the last frame meet
vec2 loopv(float k) { return vec2(cos(TAU * t), sin(TAU * t)) * k; }
vec3 pigment(float g) { float i = floor(g * 6. + .5);
  if (i < .5) return vec3(.93, .87, .72);        // E. coli, cream
  if (i < 1.5) return vec3(.88, .19, .35);       // Serratia, prodigiosin pink
  if (i < 2.5) return vec3(.36, .17, .71);       // Chromobacterium, violacein
  if (i < 3.5) return vec3(.10, .62, .55);       // Pseudomonas, pyocyanin
  if (i < 4.5) return vec3(.95, .76, .19);       // Micrococcus, yellow
  if (i < 5.5) return vec3(.85, .82, .75);       // Bacillus, chalk
  return vec3(.16, .33, .85); }                  // Streptomyces, actinorhodin blue
void main() {
  vec2 p = vec2(gl_FragCoord.x, H * dpr - gl_FragCoord.y) / dpr;
  vec2 d = p - C; float r = length(d);
  vec3 col = vec3(.043, .047, .043) + (fbm(p * .01) - .5) * .015;
  // the dish's shadow on the bench
  col *= 1. - .55 * smoothstep(RG + 70., RG - 10., length(p - C - vec2(-18., 26.)));
  if (r < RA) {
    // the agar, slightly moving, like liquid under a lens
    vec2 w = vec2(fbm(p * .006 + loopv(.6)), fbm(p * .006 + 3.3 + loopv(.6))) - .5;
    vec2 uv = .5 + (d + w * 6.) / RA * .496;
    vec4 c = texture2D(cult, uv);
    float e = 1. / 1024.;
    float vx = texture2D(cult, uv + vec2(e, 0)).r - texture2D(cult, uv - vec2(e, 0)).r;
    float vy = texture2D(cult, uv + vec2(0, e)).r - texture2D(cult, uv - vec2(0, e)).r;
    vec2 tc = (floor(uv * 1024.) + .5) / 1024.; float g = texture2D(cult, tc).g;
    float halo = texture2D(cult, uv, 4.5).r;
    float age = c.b;
    vec3 L = normalize(vec3(-.5, -.6, .7));
    // agar: honey under a light box, darker to the edge, mottled
    float rr = r / RA;
    // lit from below, brightest a little left of centre, like a plate on a light box
    float lb = smoothstep(1.05, .0, length((p - C - vec2(-RA * .35, 0.)) / RA));
    vec3 agar = mix(vec3(.30, .17, .06), vec3(.93, .74, .42), lb);
    agar *= .82 + .3 * fbm(p * .012) + .08 * (fbm(p * .08) - .5);
    // growth rings: the colonies' history, as contour lines, drifting outward
    float ring = abs(fract(age * 22. - t * 2.) - .5);
    agar *= 1. - .10 * smoothstep(.06, .0, ring) * step(age, .98);
    // pigment soaking into the agar round each colony
    vec3 pig = pigment(g);
    agar = mix(agar, agar * pig * 1.5, smoothstep(.05, .5, halo) * .55);
    // the colonies breathe: a wave travels out from where each was seeded
    float th = .30 + .05 * sin(TAU * (t - age * 3.));
    float m = smoothstep(th - .08, th + .08, c.r);
    // the colony's body: a matte lawn under the pattern, raised a little at its edge
    float lawn = smoothstep(.03, .2, texture2D(cult, uv, 2.5).r);
    agar = mix(agar, mix(agar, pig, .55) * (.75 + .35 * lb), lawn * .8);
    vec3 n = normalize(vec3(-vx * 9., -vy * 9., 1.));
    float lam = clamp(dot(n, L), 0., 1.), spec = pow(clamp(dot(reflect(-L, n), vec3(0, 0, 1)), 0., 1.), 24.);
    vec3 colony = pig * (.62 + .62 * lam) + spec * .25;
    colony *= .85 + .3 * c.r;
    col = mix(agar, colony, m);
    // scattered single colonies on the bare agar: small domes, mostly cream and yellow, a few stained
    for (int k = 0; k < 2; k++) {
      float cs = k == 0 ? 34. : 13.;
      vec2 cell = floor(p / cs), f = p / cs - cell;
      float hh = hash(cell + float(k) * 17.);
      if (hh < (k == 0 ? .30 : .16) && lawn < .05) {
        vec2 o = vec2(hash(cell + 3.1), hash(cell + 7.7)) * .5 + .25;
        float rad = (k == 0 ? (.12 + .2 * hash(cell + 5.3)) : (.12 + .12 * hash(cell + 5.3))) * (1. + .06 * sin(TAU * (t + hh * 4.)));
        float q = length(f - o) / rad;
        if (q < 1.) {
          float hs = hash(cell + 9.9);
          vec3 cc = hs < .5 ? vec3(.94, .88, .74) : hs < .78 ? vec3(.95, .78, .25) : hs < .9 ? vec3(.86, .25, .38) : vec3(.40, .22, .72);
          vec3 dn = normalize(vec3((f - o) / rad, sqrt(max(0., 1. - q * q)) + .2));
          float dl = clamp(dot(dn, L), 0., 1.);
          vec3 dot3 = cc * (.55 + .6 * dl) + pow(clamp(dot(reflect(-L, dn), vec3(0, 0, 1)), 0., 1.), 20.) * .3;
          col = mix(col, dot3, smoothstep(1., .82, q));
        } else col *= 1. - .18 * smoothstep(1.6, 1., q); // a soft ring where it has used up the agar
      }
    }
    // edge of the agar: the meniscus catches the light, the rim goes dark
    col *= 1. - .45 * smoothstep(.86, 1., rr);
    col += vec3(1., .9, .7) * .25 * smoothstep(.985, 1., rr);
  } else if (r < RG) {
    // the glass wall
    float k = (r - RA) / (RG - RA);
    col = mix(vec3(.10, .10, .09), vec3(.16, .16, .15), k);
    col += vec3(.9) * (smoothstep(.25, .0, abs(k - .12)) * .45 + smoothstep(.12, .0, abs(k - .88)) * .7);
    col *= .8 + .4 * smoothstep(-1., 1., dot(normalize(d), normalize(vec2(-.6, -.8))));
  }
  // the lid, a hairline sitting slightly off centre
  float lid = abs(length(p - C - vec2(-9., -7.)) - RG - 9.);
  col += vec3(.75) * .35 * smoothstep(1.2, 0., lid);
  // grain
  col += (hash(p * dpr + fract(t * 37.) * 91.) - .5) * .035;
  gl_FragColor = vec4(col, 1.);
}`));
  gl.linkProgram(pr); gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const ap = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(ap); gl.vertexAttribPointer(ap, 2, gl.FLOAT, false, 0, 0);
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img); gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const U = n => gl.getUniformLocation(pr, n);
  gl.uniform1f(U('dpr'), dpr); gl.uniform2f(U('C'), CX, CY); gl.uniform1f(U('RA'), RA); gl.uniform1f(U('RG'), RG); gl.uniform1f(U('H'), H);
  gl.viewport(0, 0, PW, PH);

  // ---------- The waterfall: every line horizontal, falling down the left, stretching as it falls ----------
  const fg = document.getElementById('fg'); fg.width = PW; fg.height = PH; const x = fg.getContext('2d');
  const COL = [M, 392], TOP = M, BOT = H - M, CREAM = '#EFE7D6';
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const SP = [['Escherichia coli K-12', 'MG1655', '#EEDDB8'], ['Serratia marcescens', 'prodigiosin', '#E8466A'], ['Chromobacterium violaceum', 'violacein', '#8A63E6'],
    ['Pseudomonas aeruginosa', 'pyocyanin', '#2BB3A0'], ['Micrococcus luteus', 'carotenoid', '#F2C230'], ['Bacillus subtilis 168', 'swarming', '#D8D2C0'], ['Streptomyces coelicolor', 'actinorhodin', '#4E7BF2']];
  const seq = n => Array.from({ length: n }, () => Array.from({ length: 3 }, () => pick('ACGT')).join('')).join(' ');
  const pad = (v, n) => String(v).padStart(n, '0');
  const rows = [];
  const word = w => rows.push({ k: 'word', s: w, u: 6 });
  let tsec = 0;
  const data = () => { tsec += 37 + Math.floor(rnd() * 400); const kind = rnd();
    if (kind < .3) rows.push({ k: 'data', s: seq(7), u: 1 });
    else if (kind < .55) rows.push({ k: 'data', s: `T+${pad(Math.floor(tsec / 3600), 2)}:${pad(Math.floor(tsec / 60) % 60, 2)}:${pad(tsec % 60, 2)}   OD600 ${(rnd() * .9 + .01).toFixed(3)}   37.0 °C`, u: 1 });
    else if (kind < .8) rows.push({ k: 'data', s: `WELL ${pick('ABCDEFGH')}${pad(1 + Math.floor(rnd() * 12), 2)}   ${(rnd() * 9 + 1).toFixed(1)}E+0${4 + Math.floor(rnd() * 5)} CFU/mL`, u: 1 });
    else { const s = pick(SP); rows.push({ k: 'sp', s: `${s[0]}   ${s[1]}`, c: s[2], u: 1.4 }); } };
  // the order the stream runs in; it repeats every loop
  const plan = ['Biotech', 'Culture', 'Colony', 'Growth'];
  plan.forEach(wd => { word(wd); for (let i = 0; i < 16; i++) data(); });
  const TOTAL = rows.reduce((s, r) => s + r.u, 0);
  let acc = 0; rows.forEach(r => { r.o = acc / TOTAL; acc += r.u; });
  // gravity: y = a·u + b·u², slow and packed at the top, fast and stretched at the bottom
  const SPAN = BOT - TOP, A = SPAN / 4.6, B = SPAN - A, Y = u => TOP + A * u + B * u * u;
  // the frame 0 phase: Biotech, big and near the bottom
  const PH0 = .70;
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const wordFit = {}; x.font = '600 100px "Inter Tight"';
  for (const wd of plan) { const m = x.measureText(wd); wordFit[wd] = { s: (COL[1] - COL[0]) / (m.actualBoundingBoxLeft + m.actualBoundingBoxRight), l: m.actualBoundingBoxLeft, asc: m.actualBoundingBoxAscent, h: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent }; }

  function drawType(t) {
    x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
    x.save(); x.beginPath(); x.rect(COL[0], TOP, COL[1] - COL[0] + 2, SPAN); x.clip();
    for (const r of rows) for (const wrap of [0, -1]) {
      const u0 = ((r.o + t + PH0) % 1) + wrap, u1 = u0 + r.u / TOTAL;
      if (u1 < 0 || u0 > 1) continue;
      const y0 = Y(u0), y1 = Y(u1), hgt = y1 - y0;
      if (r.k === 'word') {
        const f = wordFit[r.s], gap = hgt * .08;
        x.save(); x.translate(COL[0], y0 + gap); x.scale(f.s, (hgt - gap * 2) / (f.h)); x.font = '600 100px "Inter Tight"'; x.fillStyle = CREAM;
        x.fillText(r.s, f.l, f.asc); x.restore();
      } else {
        // 13px mono, squeezed or stretched to its slot; fades in from the dense top
        const sy = hgt / 15;
        x.save(); x.translate(COL[0], y0); x.scale(1, sy); x.font = (r.k === 'sp' ? '500' : '400') + ' 13px "IBM Plex Mono"';
        x.fillStyle = r.k === 'sp' ? r.c : CREAM; x.globalAlpha = (r.k === 'sp' ? 1 : .62) * Math.min(1, .35 + u0 * 1.2);
        x.textBaseline = 'top'; x.fillText(r.k === 'sp' ? r.s : r.s.toUpperCase(), 0, 1); x.restore();
      }
    }
    x.restore();
  }

  // swimmers: a few hundred rods moving across the agar on closed paths
  const SW = Array.from({ length: 260 }, () => { const a = Math.PI / 2 + rnd() * Math.PI, rr = Math.sqrt(rnd()) * (RA - 30);
    return { cx: CX + Math.cos(a) * rr, cy: CY + Math.sin(a) * rr, R: 6 + rnd() * 26, ph: rnd(), n: rnd() < .5 ? 1 : -1, l: 2 + rnd() * 2.5 }; });
  function drawSwim(t) {
    x.save(); x.beginPath(); x.arc(CX, CY, RA - 4, 0, Math.PI * 2); x.clip();
    x.strokeStyle = 'rgba(255,246,225,.32)'; x.lineCap = 'round'; x.lineWidth = 1.2;
    for (const s of SW) { const a = (s.ph + t * s.n) * Math.PI * 2, px = s.cx + Math.cos(a) * s.R, py = s.cy + Math.sin(a) * s.R * .6, dx = -Math.sin(a) * s.n, dy = Math.cos(a) * .6 * s.n, dl = Math.hypot(dx, dy);
      x.beginPath(); x.moveTo(px - dx / dl * s.l / 2, py - dy / dl * s.l / 2); x.lineTo(px + dx / dl * s.l / 2, py + dy / dl * s.l / 2); x.stroke(); }
    x.restore();
  }

  const draw = async sec => {
    const t = ((sec / LOOP) % 1 + 1) % 1;
    gl.uniform1f(U('t'), t); gl.drawArrays(gl.TRIANGLES, 0, 3);
    drawType(t); drawSwim(t);
  };
  await draw(0);
  document.body.dataset.ready = '1';
  return draw;
})();
window.__seek = async t => { const draw = await READY; await draw(t); };
</script>
</body>
</html>
