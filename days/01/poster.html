<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Day 01: Day one.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; width:1240px; height:1754px; overflow:hidden; background:#F2EDE3; }
  canvas { position:absolute; left:0; top:0; width:1240px; height:1754px; }
  /* every text block sits on the pixel grid: left edges on column starts, tops on the margin line, bottoms on the footer line */
  .t { position:absolute; font:400 13px/18px 'JetBrains Mono', monospace; letter-spacing:.02em; color:#17161A; text-transform:uppercase; margin:0; }
  .t .k { display:block; color:#8A8478; }
  .t .jp { font-family:'Noto Sans JP', sans-serif; font-weight:700; letter-spacing:.08em; text-transform:none; }
  .sw { position:absolute; font:400 11px/20px 'JetBrains Mono', monospace; letter-spacing:.02em; text-transform:uppercase; color:#17161A; }
  .sw b { display:block; font:700 13px/18px 'Noto Sans JP', sans-serif; letter-spacing:.06em; }
  .sw span { color:#8A8478; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="type"></div>
<script>
(async () => {
  // ---------- The grid: 100 px margin all round, 17 columns, 25 rows, 58 px square pixels ----------
  const W = 1240, H = 1754, M = 100, S = 58, COLS = 17, ROWS = 25;
  const PX = (W - 2 * M - S) / (COLS - 1), PY = (H - 2 * M - S) / (ROWS - 1);
  const cx = c => M + c * PX, cy = r => M + r * PY;

  // ---------- Bold condensed letters, Bauhaus construction: squares, quarter circles, triangles ----------
  // # square   1 2 3 4 quarter circle rounding the top-left, top-right, bottom-right, bottom-left   a lower-left triangle   b upper-right triangle
  const G = {
    D: ['###2.', '####2', '##.##', '##.##', '##.##', '##.##', '##.##', '##.##', '####3', '###3.'],
    A: ['.1#2.', '1###2', '##.##', '##.##', '##.##', '#####', '##.##', '##.##', '##.##', '##.##'],
    Y: ['##.##', '##.##', '##.##', '##.##', '4###3', '.###.', '.###.', '.###.', '.###.', '.###.'],
    O: ['1###2', '##.##', '##.##', '##.##', '##.##', '##.##', '##.##', '##.##', '##.##', '4###3'],
    N: ['##..##', '###.##', '###.##', '###.##', '###a##', '##b###', '##.###', '##.###', '##.###', '##..##'],
    E: ['####', '##..', '##..', '##..', '###.', '##..', '##..', '##..', '##..', '####']
  };
  const cells = [];
  const set = (word, row) => { let col = 0; for (const ch of word) { G[ch].forEach((line, r) => [...line].forEach((k, c) => { if (k !== '.') cells.push({ col: col + c, row: row + r, k }); })); col += G[ch][0].length + 1; } };
  set('DAY', 2); set('ONE', 13);

  // ---------- A Japanese gradient: traditional colours, mixed in OKLab so the blend stays clean ----------
  const STOPS = [
    [0.00, '#113285', '紺青', 'Konjō'],
    [0.26, '#66327C', '菫', 'Sumire'],
    [0.50, '#E03C8A', '躑躅', 'Tsutsuji'],
    [0.74, '#F17C67', '珊瑚朱', 'Sangoshu'],
    [1.00, '#FFB11B', '山吹', 'Yamabuki']
  ];
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  const lin = v => v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4, gam = v => v <= .0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - .055;
  const toLab = ([r, g, b]) => { [r, g, b] = [lin(r), lin(g), lin(b)];
    const l = Math.cbrt(.4122214708 * r + .5363325363 * g + .0514459929 * b), m = Math.cbrt(.2119034982 * r + .6806995451 * g + .1073969566 * b), s = Math.cbrt(.0883024619 * r + .2817188376 * g + .6299787005 * b);
    return [.2104542553 * l + .7936177850 * m - .0040720468 * s, 1.9779984951 * l - 2.4285922050 * m + .4505937099 * s, .0259040371 * l + .7827717662 * m - .8086757660 * s]; };
  const toRgb = ([L, a, b]) => { const l = (L + .3963377774 * a + .2158037573 * b) ** 3, m = (L - .1055613458 * a - .0638541728 * b) ** 3, s = (L - .0894841775 * a - 1.2914855480 * b) ** 3;
    return [4.0767416621 * l - 3.3077115913 * m + .2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - .3413193965 * s, -.0041960863 * l - .7034186147 * m + 1.7076147010 * s].map(v => Math.round(255 * Math.min(1, Math.max(0, gam(Math.max(0, v)))))); };
  const LAB = STOPS.map(s => [s[0], toLab(hex(s[1]))]);
  const at = t => { t = Math.min(1, Math.max(0, t)); let i = 0; while (i < LAB.length - 2 && t > LAB[i + 1][0]) i++;
    const [t0, a] = LAB[i], [t1, b] = LAB[i + 1], k = (t - t0) / (t1 - t0); return toRgb(a.map((v, j) => v + (b[j] - v) * k)); };
  // mostly top to bottom, leaning to the right, with a slow wave like a wash of ink
  const tAt = (x, y) => { const u = (x - M) / (W - 2 * M), v = (y - cy(2)) / (cy(22) + S - cy(2)); return .82 * v + .18 * u + .035 * Math.sin(u * 5.2 + v * 2.4); };
  const css = ([r, g, b], a = 1) => `rgba(${r},${g},${b},${a})`;

  // ---------- Canvas at device resolution, seeded so every render is the same ----------
  const dpr = window.devicePixelRatio || 1, cv = document.getElementById('c');
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  let seed = 101; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const layer = () => { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; const x = c.getContext('2d'); x.scale(dpr, dpr); return [c, x]; };

  function shape(x, k, X, Y) {
    x.beginPath();
    if (k === '#') x.rect(X, Y, S, S);
    else if (k === 'a') { x.moveTo(X, Y); x.lineTo(X, Y + S); x.lineTo(X + S, Y + S); }
    else if (k === 'b') { x.moveTo(X, Y); x.lineTo(X + S, Y); x.lineTo(X + S, Y + S); }
    else { const o = { 1: [X + S, Y + S, Math.PI, 1.5 * Math.PI], 2: [X, Y + S, 1.5 * Math.PI, 2 * Math.PI], 3: [X, Y, 0, .5 * Math.PI], 4: [X + S, Y, .5 * Math.PI, Math.PI] }[k];
      x.moveTo(o[0], o[1]); x.arc(o[0], o[1], S, o[2], o[3]); }
    x.closePath(); x.fill();
  }

  // 1. The pixels: one flat colour each, sampled from the gradient at the pixel's centre
  const [L, lx] = layer();
  for (const p of cells) { const X = cx(p.col), Y = cy(p.row); lx.fillStyle = css(at(tAt(X + S / 2, Y + S / 2))); shape(lx, p.k, X, Y); }
  // the five swatches in the footer are pixels too
  const swCols = [0, 3, 6, 9, 12];
  STOPS.forEach((s, i) => { lx.fillStyle = s[1]; shape(lx, '#', cx(swCols[i]), cy(24)); });

  // 2. Brush: long, slightly bent strokes laid only onto the pixels, coloured from the smooth gradient so the steps blur like paint
  lx.globalCompositeOperation = 'source-atop'; lx.lineCap = 'round';
  const stroke = (y0, x0, len, w, col) => { const bend = (rnd() - .5) * 6, tilt = (rnd() - .5) * 10;
    lx.strokeStyle = col; lx.lineWidth = w; lx.beginPath(); lx.moveTo(x0, y0); lx.quadraticCurveTo(x0 + len / 2, y0 + bend, x0 + len, y0 + tilt); lx.stroke(); };
  for (let i = 0; i < 5200; i++) { const x0 = M - 40 + rnd() * (W - 2 * M + 40), y0 = M + rnd() * (H - 2 * M), sw = y0 >= cy(24) - 8;
    const col = sw ? null : at(tAt(x0, y0) + (rnd() - .5) * .07); if (!col) continue;
    stroke(y0, x0, 40 + rnd() * 260, .6 + rnd() * 3.4, css(col, .35 + rnd() * .45)); }
  // dry bristles: fine light and dark hairlines
  for (let i = 0; i < 9000; i++) { const x0 = M - 30 + rnd() * (W - 2 * M + 30), y0 = M + rnd() * (H - 2 * M), d = rnd() < .5;
    stroke(y0, x0, 20 + rnd() * 180, .4 + rnd() * 1.1, d ? `rgba(20,10,40,${.06 + rnd() * .16})` : `rgba(255,248,236,${.06 + rnd() * .2})`); }
  // uneven load of paint: soft blotches
  for (let i = 0; i < 260; i++) { const x0 = M + rnd() * (W - 2 * M), y0 = M + rnd() * (H - 2 * M), r = 20 + rnd() * 90;
    const g = lx.createRadialGradient(x0, y0, 0, x0, y0, r), d = rnd() < .5 ? '20,10,40' : '255,246,230', a = .05 + rnd() * .12;
    g.addColorStop(0, `rgba(${d},${a})`); g.addColorStop(1, `rgba(${d},0)`); lx.fillStyle = g; lx.fillRect(x0 - r, y0 - r, 2 * r, 2 * r); }
  lx.globalCompositeOperation = 'source-over';

  // 3. Flatten: paper, the empty grid as faint registration dots, then the pixels
  const x = cv.getContext('2d'); x.scale(dpr, dpr);
  x.fillStyle = '#F2EDE3'; x.fillRect(0, 0, W, H);
  const filled = new Set(cells.map(p => p.col + ',' + p.row));
  x.fillStyle = 'rgba(23,22,26,.16)';
  for (let r = 2; r <= 22; r++) if (r !== 12) for (let c = 0; c < COLS; c++) if (!filled.has(c + ',' + r)) { x.beginPath(); x.arc(cx(c) + S / 2, cy(r) + S / 2, 1.6, 0, 7); x.fill(); }
  x.setTransform(1, 0, 0, 1, 0, 0); x.drawImage(L, 0, 0);

  // 4. Aggressive grain: hard on the paint, lighter on the paper, with streaks that run with the brush
  const img = x.getImageData(0, 0, cv.width, cv.height), d = img.data, mask = lx.getImageData(0, 0, cv.width, cv.height).data, w = cv.width;
  const streak = new Float32Array(cv.height); for (let y = 0; y < cv.height; y++) streak[y] = (rnd() - .5) * 26;
  for (let i = 0, n = 0; i < d.length; i += 4, n++) {
    const paint = mask[i + 3] / 255, y = (n / w) | 0;
    const g = (rnd() - .5) * (34 + 76 * paint) + streak[y] * paint * (rnd() < .5 ? 1 : .4);
    d[i] += g; d[i + 1] += g; d[i + 2] += g;
  }
  x.putImageData(img, 0, 0);

  // ---------- Type, anchored to the grid ----------
  const T = document.getElementById('type');
  const put = (html, col, top, cls = 't', extra = '') => T.insertAdjacentHTML('beforeend', `<p class="${cls}" style="left:${cx(col).toFixed(2)}px;top:${top}px;${extra}">${html}</p>`);
  // header: three fields over the three letters of DAY, on the top margin line
  put('<span class="k">Thirty posters</span>Day 01 of 30', 0, M);
  put('<span class="k jp">一日目</span>The first day', 6, M);
  put('<span class="k">Prompted in 60 s</span>10 Nov 2026', 12, M);
  // footer: the five colours of the gradient, each named beside its own pixel, bottoms on the bottom margin line
  STOPS.forEach((s, i) => T.insertAdjacentHTML('beforeend', `<div class="sw" style="left:${(cx(swCols[i]) + S + 10).toFixed(2)}px;top:${cy(24).toFixed(2)}px"><b>${s[2]}</b>${s[3]}<br><span>${s[1]}</span></div>`));
  // the build, right edge on the right margin line, bottom on the bottom margin line
  T.insertAdjacentHTML('beforeend', `<p class="t" style="right:${M}px;top:${(cy(24) + S - 36).toFixed(2)}px;text-align:right"><span class="k">17 × 25 grid</span>58 px pixels</p>`);
  window.__ready = true;
})();
</script>
</body>
</html>
