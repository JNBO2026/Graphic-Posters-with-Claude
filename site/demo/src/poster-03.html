<!doctype html><html><head><meta charset="utf-8">
<meta name="poster-motion" content="10"><meta name="poster-motion-fps" content="24">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1240px;height:1754px;background:#111;overflow:hidden}
.p{position:relative;width:1240px;height:1754px;color:#EDEBE4;font-family:'IBM Plex Mono',monospace}
.n{position:absolute;left:50%;top:180px;transform:translateX(-50%);display:flex;font-family:'Archivo Black';font-size:620px;line-height:1}
.d{height:1.2em;line-height:1.2em;overflow:hidden;width:.72em;text-align:center}
.s{display:flex;flex-direction:column;animation:roll 10s steps(10) infinite}
.s i{font-style:normal;height:1.2em}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(-12em)}}
.ring{position:absolute;left:50%;top:1010px;width:420px;height:420px;margin-left:-210px;border-radius:50%;border:3px solid #333}
.hand{position:absolute;left:50%;top:50%;width:3px;height:200px;background:#FF4A1C;transform-origin:50% 0;animation:spin 10s linear infinite;margin-left:-1.5px}
@keyframes spin{from{transform:rotate(180deg)}to{transform:rotate(540deg)}}
.m{position:absolute;left:64px;bottom:64px;right:64px;display:flex;justify-content:space-between;font-size:20px;letter-spacing:.08em;text-transform:uppercase;border-top:3px solid #EDEBE4;padding-top:20px}
</style></head><body><div class="p">
<div class="n"><div class="d">0</div><div class="d"><div class="s"><i>9</i><i>8</i><i>7</i><i>6</i><i>5</i><i>4</i><i>3</i><i>2</i><i>1</i><i>0</i><i>9</i></div></div></div>
<div class="ring"><div class="hand"></div></div>
<div class="m"><span>Demo poster 03, animated</span><span>Code only</span></div></div></body></html>
