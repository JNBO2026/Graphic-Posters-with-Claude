<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thirty Posters</title>
<meta name="description" content="30 days, 30 posters, 60 seconds of prompting each. Every prompt free to copy.">
<!-- og:start -->
<!-- og:end -->
<link rel="stylesheet" href="system/assets/fonts/fonts.css">
<style>
  /* Blame Opal: one ink, three papers, one acid. Light hairline bento on a black ground. */
  :root {
    --paper:#FAFAF4; --raised:#EEEEE7; --sunken:#E1E1D9; --ink:#101010; --on-ink:#FAFAF4;
    --sec:#101010AD; --line:#1010101F; --line2:#1010103D; --glass:#FAFAF4EB; --acid:#67FF67; --ground:#000;
    --mark:none; --radius:10px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper:#1A1A1A; --raised:#262626; --sunken:#121212; --ink:#FAFAF4; --on-ink:#101010;
    --sec:#FAFAF49E; --line:#FAFAF41F; --line2:#FAFAF43D; --glass:#1A1A1AEB; --mark:invert(1); } }
  :root[data-theme="dark"] {
    --paper:#1A1A1A; --raised:#262626; --sunken:#121212; --ink:#FAFAF4; --on-ink:#101010;
    --sec:#FAFAF49E; --line:#FAFAF41F; --line2:#FAFAF43D; --glass:#1A1A1AEB; --mark:invert(1); }

  * { box-sizing:border-box; margin:0; padding:0; }
  [hidden] { display:none !important; }
  html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
  body { background:var(--ground); color:var(--ink); font-family:'Instrument Sans', system-ui, sans-serif;
         font-kerning:normal; -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  .k { font:500 14px/16px 'Instrument Sans'; color:var(--sec); }
  .meta { font:500 12px/14px 'Instrument Sans'; color:var(--sec); }
  button { font:inherit; color:inherit; }

  /* ---------- The canvas: an endless wall of A3 slots, no gaps ---------- */
  #canvas { position:fixed; inset:0; overflow:hidden; cursor:grab; touch-action:none; }
  #world { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
  #canvas.drag { cursor:grabbing; }
  @media (hover:hover) and (pointer:fine) { #canvas, #canvas * { cursor:none !important; } }
  .block { position:absolute; left:0; top:0; display:grid; grid-template-columns:repeat(6, var(--tw)); grid-auto-rows:var(--th); gap:2px; padding:1px; will-change:transform; }
  .cell { position:relative; width:var(--tw); height:var(--th); overflow:hidden; border:0; padding:0; text-align:left;
          background:var(--paper); border-radius:var(--radius); display:block; isolation:isolate; }
  .cell img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; user-select:none; }
  .cell .in { position:absolute; inset:0; padding:12px; display:flex; flex-direction:column; justify-content:space-between; }
  .cell .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .cell .big { font:600 64px/64px 'Instrument Sans'; color:var(--line2); letter-spacing:-.01em; }
  .cell .note { font:400 14px/18px 'Instrument Sans'; color:var(--sec); }
  .cell.next { background:var(--raised); }
  .cell.next .big { color:var(--ink); }
  .dot { width:8px; height:8px; border-radius:50%; background:currentColor; display:inline-block; }
  .cell.next .dot { animation:pulse 1.2s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity:1 } to { opacity:.25 } }
  /* posted poster hover */
  .cell .over { position:absolute; inset:0; padding:12px; display:flex; flex-direction:column; justify-content:flex-end; gap:6px;
                background:linear-gradient(to top, rgba(16,16,16,.92), rgba(16,16,16,.6) 50%, rgba(16,16,16,0)); color:#FAFAF4; opacity:0;
                transition:opacity 200ms cubic-bezier(.2,.7,.2,1); }
  .cell .over .meta { color:#FAFAF49E; }
  .cell .over b { font:600 18px/18px 'Instrument Sans'; }
  .cell .over span.p { font:400 14px/18px 'Instrument Sans'; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .cell .chip { position:absolute; left:8px; top:8px; padding:4px 8px; border-radius:999px; background:var(--glass);
                backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); font:500 12px/14px 'Instrument Sans'; color:var(--ink); }
  @media (hover:hover) { .cell.posted:hover .over, .cell.posted:focus-visible .over { opacity:1; } }
  .cell:focus-visible { outline:2px solid var(--ink); outline-offset:-4px; }

  /* ---------- Digital clocks: every digit rolls ---------- */
  .clock { display:flex; align-items:flex-start; gap:4px; font-variant-numeric:tabular-nums; }
  .clock .grp { display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
  .clock .ds { display:flex; }
  .clock .dg { display:inline-block; width:.62em; height:1em; overflow:hidden; line-height:1em; text-align:center; }
  .clock .col { display:flex; flex-direction:column; transition:transform 250ms cubic-bezier(.2,.7,.2,1); }
  .clock .col i { font-style:normal; height:1em; }
  .clock .sep { line-height:1em; opacity:.4; }
  .clock .u { font:500 12px/14px 'Instrument Sans'; opacity:.62; }
  .clock.s { font:600 20px/20px 'Instrument Sans'; }
  .clock.m { font:600 28px/28px 'Instrument Sans'; }
  .clock.l { font:600 44px/44px 'Instrument Sans'; letter-spacing:-.01em; }

  /* ---------- HUD: framed bento on glass ---------- */
  .hud { position:fixed; z-index:5; }
  .glass { background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
  .chiprow { display:flex; align-items:center; gap:12px; padding:10px 16px; border-radius:999px; box-shadow:0 0 0 2px var(--ground); }
  .lock { display:flex; align-items:center; gap:8px; font:600 16px/16px 'Instrument Sans'; text-decoration:none; }
  .lock img { height:14px; width:auto; filter:var(--mark); }
  .hud.tl { top:16px; left:16px; }
  .hud.tr { top:16px; right:16px; }
  .prog { display:flex; gap:2px; }
  .prog i { width:4px; height:14px; border-radius:2px; background:var(--line2); }
  .prog i.on { background:var(--ink); }
  .tile { background:var(--paper); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:12px; }
  .hud .tile { box-shadow:0 0 0 2px var(--ground); }
  .hud.bl { left:16px; bottom:16px; width:340px; display:flex; flex-direction:column; gap:2px; }
  .hud.bl h1 { font:600 28px/28px 'Instrument Sans'; text-wrap:balance; }
  .hud.bl p { font:400 14px/18px 'Instrument Sans'; color:var(--sec); }
  .hud.br { right:16px; bottom:16px; width:340px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn { font:500 16px/16px 'Instrument Sans'; border-radius:999px; padding:14px 20px; border:0; cursor:pointer; text-decoration:none;
         display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap; transition:transform 200ms cubic-bezier(.2,.7,.2,1); }
  .btn:active { transform:scale(.96); }
  .btn.go { background:var(--acid); color:#101010; }
  .btn.ghost { background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line2); }
  .btn .arr { transition:transform 200ms cubic-bezier(.2,.7,.2,1); }
  @media (hover:hover) { .btn:hover .arr { transform:translateX(3px); } }
  .hint { left:50%; bottom:76px; transform:translateX(-50%); padding:10px 16px; border-radius:999px; font:500 14px/16px 'Instrument Sans'; pointer-events:none; }
  .sign { font:500 12px/14px 'Instrument Sans'; color:var(--sec); flex-direction:row !important; align-items:center; justify-content:space-between; }
  .ast { width:16px; height:16px; color:var(--ink); }

  /* ---------- The cursor: the blame opal pointer, doing something ---------- */
  #cur { position:fixed; left:0; top:0; z-index:20; pointer-events:none; display:none; }
  @media (hover:hover) and (pointer:fine) { #cur { display:block; } }
  #cur svg { display:block; transform-origin:16.66% 16.66%; color:var(--ink); }
  #cur .tag { position:absolute; left:22px; top:24px; padding:4px 10px; border-radius:999px; white-space:nowrap;
              background:var(--ink); color:var(--on-ink); font:500 12px/14px 'Instrument Sans'; }
  #cur.off { opacity:0; }
  #cur.inv svg { color:var(--on-ink); }
  #cur.inv .tag { background:var(--on-ink); color:var(--ink); }

  /* ---------- Intro: sixty seconds ---------- */
  #intro { position:fixed; inset:0; z-index:30; background:var(--ink); color:var(--on-ink); display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:16px; }
  #intro .n { font:600 158px/130px 'Instrument Sans'; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  #intro .k { color:color-mix(in srgb, var(--on-ink) 62%, transparent); }

  /* ---------- The preview: opens from the poster you clicked ---------- */
  dialog { border:0; padding:0; background:transparent; max-width:none; max-height:none; width:100vw; height:100dvh; color:var(--ink); }
  dialog::backdrop { background:rgba(0,0,0,.88); }
  .sheet { width:100%; height:100%; display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:2px; background:var(--ground); }
  .stage { display:flex; align-items:center; justify-content:center; padding:32px; background:var(--sunken); min-height:0; }
  .stage { position:relative; touch-action:pan-y; }
  .stage img, .stage video { max-width:100%; max-height:100%; aspect-ratio:1 / 1.4142; object-fit:contain; display:block; box-shadow:0 24px 64px rgba(0,0,0,.28); background:var(--paper); }
  .arrow { position:absolute; top:50%; margin-top:-28px; width:56px; height:56px; border-radius:50%; border:0; cursor:pointer; z-index:2;
           display:flex; align-items:center; justify-content:center; color:var(--ink); background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
           box-shadow:0 0 0 2px var(--ground); transition:transform 200ms cubic-bezier(.2,.7,.2,1); }
  .arrow.l { left:24px; } .arrow.r { right:24px; }
  @media (hover:hover) { .arrow.l:hover { transform:translateX(-3px); } .arrow.r:hover { transform:translateX(3px); } }
  .arrow:active { transform:scale(.96); }
  .stage .count { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); padding:6px 12px; border-radius:999px; font:500 12px/14px 'Instrument Sans';
                  background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); box-shadow:0 0 0 2px var(--ground); }
  /* tool lozenges: tagged like a mention */
  .lz { display:inline-flex; align-items:center; gap:6px; vertical-align:-3px; padding:2px 8px 2px 4px; margin:1px 0; border-radius:999px; white-space:nowrap;
        background:var(--raised); box-shadow:inset 0 0 0 1.5px var(--line2); font:500 12px/16px 'Instrument Sans'; color:var(--ink); }
  .lz svg, .lz b { width:16px; height:16px; flex:none; }
  a.lz { text-decoration:none; transition:background 200ms cubic-bezier(.2,.7,.2,1); }
  @media (hover:hover) { a.lz:hover { background:var(--paper); } a.lz:hover .ext { transform:translate(2px,-2px); } }
  .lz .ext { width:12px; height:12px; padding:0; transition:transform 200ms cubic-bezier(.2,.7,.2,1); }
  .lz svg { padding:2px; }
  .lz b { display:inline-flex; align-items:center; justify-content:center; border-radius:50%; background:var(--ink); color:var(--on-ink); font:600 10px/10px 'Instrument Sans'; }
  .made p { line-height:22px !important; }
  /* motion posters on the wall */
  .cell video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; }
  .chip svg { width:10px; height:10px; vertical-align:-1px; margin-left:4px; }
  /* zoom */
  .zoom { left:50%; bottom:16px; transform:translateX(-50%); padding:4px; gap:2px; }
  .zoom button { width:36px; height:36px; border-radius:50%; border:0; background:transparent; color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  .zoom button.pct { width:auto; padding:0 10px; border-radius:999px; font:500 14px/16px 'Instrument Sans'; font-variant-numeric:tabular-nums; }
  @media (hover:hover) { .zoom button:hover { background:var(--raised); } }
  .zoom button:active { transform:scale(.96); }
  .side { background:var(--paper); display:flex; flex-direction:column; gap:24px; padding:24px; overflow:auto; }
  .side .top { display:flex; justify-content:space-between; align-items:center; }
  .side h2 { font:600 44px/44px 'Instrument Sans'; text-wrap:balance; }
  .side .note { font:400 16px/24px 'Instrument Sans'; color:var(--sec); }
  .well { background:var(--raised); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:12px; }
  .well pre { font:400 16px/24px 'Instrument Sans'; white-space:pre-wrap; word-wrap:break-word; }
  .icon { width:40px; height:40px; border-radius:50%; border:0; background:var(--raised); color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  .nav { display:flex; gap:8px; margin-top:auto; }
  .made { display:flex; flex-direction:column; gap:8px; padding:0 16px; }
  /* share */
  .share { background:var(--raised); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:12px; }
  .share .head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .share h3 { font:600 18px/18px 'Instrument Sans'; }
  .share p { font:400 14px/18px 'Instrument Sans'; color:var(--sec); }
  .share .card { display:block; width:100%; border-radius:var(--radius); background:var(--sunken); box-shadow:0 0 0 2px var(--ground); }
  .share .card.story { width:56%; margin:0 auto; }
  .share .plats { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .share .plat { display:flex; align-items:center; justify-content:center; gap:6px; padding:10px 8px; border-radius:999px; border:0; cursor:pointer; text-decoration:none;
                 background:var(--paper); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line2); font:500 14px/16px 'Instrument Sans'; transition:transform 200ms cubic-bezier(.2,.7,.2,1); }
  .share .plat svg { width:16px; height:16px; flex:none; }
  .share .plat:active { transform:scale(.96); }
  @media (hover:hover) { .share .plat:hover { background:var(--sunken); } }
  .share .plat.wide { grid-column:1 / -1; }
  .share .tip { font:500 12px/14px 'Instrument Sans'; color:var(--sec); }
  .made p { font:400 14px/18px 'Instrument Sans'; color:var(--sec); }
  .tools { display:flex; flex-wrap:wrap; gap:6px; }
  .tools span { font:500 12px/14px 'Instrument Sans'; padding:6px 10px; border-radius:999px; box-shadow:inset 0 0 0 1.5px var(--line2); }
  .demo { left:50%; top:16px; transform:translateX(-50%); padding:10px 16px; border-radius:999px; font:500 14px/16px 'Instrument Sans'; box-shadow:0 0 0 2px var(--ground); }
  @media (max-width:760px) { .demo { top:64px; } }
  .fly { position:fixed; z-index:40; object-fit:cover; pointer-events:none; }

  /* ---------- Phone ---------- */
  @media (max-width:760px) {
    .hud.tl { top:12px; left:12px; } .hud.tr { top:12px; right:12px; }
    .chiprow { padding:8px 12px; gap:8px; }
    .hud.tl .k, .hud.tr .k { display:none; }
    .hud.bl { display:none; }
    .hud.br { left:12px; right:12px; bottom:12px; width:auto; }
    .hud.br .tile { display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px 12px; padding:12px; }
    .hud.br .tile .k { grid-column:1; }
    .hud.br #next-clock { grid-column:1; }
    .hud.br .btn { grid-column:2; grid-row:1 / span 2; }
    .hud.br .clock.l { font:600 20px/20px 'Instrument Sans'; }
    .hud.br .clock .u { display:none; }
    .hud.br .lede { display:none; }
    .hint { bottom:112px; }
    .sheet { grid-template-columns:1fr; height:auto; min-height:100%; }
    dialog { overflow:auto; }
    .stage { padding:16px; }
    .stage img, .stage video { max-height:70dvh; }
    .arrow { width:44px; height:44px; margin-top:-22px; } .arrow.l { left:12px; } .arrow.r { right:12px; }
    .zoom { display:none !important; }
    .side h2 { font:600 28px/28px 'Instrument Sans'; }
    #intro .n { font:600 88px/80px 'Instrument Sans'; }
    .cell .big { font:600 44px/44px 'Instrument Sans'; }
    .cell .in { padding:10px; }
    .clock { gap:2px; }
    .clock.s { font:600 14px/14px 'Instrument Sans'; }
    .clock.m { font:600 16px/16px 'Instrument Sans'; }
    .clock .u { font:500 10px/12px 'Instrument Sans'; }
    .cell .note { font:400 12px/14px 'Instrument Sans'; }
  }
</style>
</head>
<body>
<main id="canvas" aria-label="All 30 posters. Drag or scroll to explore, pinch or use + and - to zoom, click a poster to open it."><div id="world"></div></main>
<div id="proxy" hidden></div>

<header class="hud tl glass chiprow">
  <a class="lock" href="https://blameopal.studio"><img src="system/assets/brand/bo-mark.svg" alt="">blame opal</a>
  <span class="k">Thirty posters</span>
</header>
<div class="hud tr glass chiprow">
  <span class="k" id="count"></span>
  <span class="prog" id="prog" aria-hidden="true"></span>
</div>

<aside class="hud bl" id="latest"></aside>

<aside class="hud br">
  <div class="tile">
    <span class="k" id="next-k"></span>
    <div id="next-clock"></div>
    <p class="lede k" id="next-note"></p>
    <a class="btn go" id="gh" href="#" target="_blank" rel="noopener">Watch on GitHub <span class="arr">→</span></a>
  </div>
</aside>

<div class="hud hint glass" id="hint">Drag or scroll to explore. Pinch to zoom.</div>
<div class="hud zoom glass chiprow" role="group" aria-label="Zoom">
  <button id="z-out" aria-label="Zoom out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <button class="pct" id="z-pct" aria-label="Reset zoom">100%</button>
  <button id="z-in" aria-label="Zoom in"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button>
</div>

<div id="cur" aria-hidden="true">
  <svg width="32" height="32" viewBox="0 0 24 24"><path fill="currentColor" d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/></svg>
  <span class="tag" id="cur-tag">Drag</span>
</div>

<div id="intro" aria-hidden="true"><span class="n" id="intro-n">60</span><span class="k">seconds to write the prompt</span></div>

<dialog id="view" aria-label="Poster preview">
  <div class="sheet">
    <div class="stage" id="stage">
      <button class="arrow l" id="s-prev" aria-label="Previous poster"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <img id="v-img" alt="">
      <video id="v-vid" playsinline muted loop controls preload="metadata" hidden></video>
      <button class="arrow r" id="s-next" aria-label="Next poster"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      <span class="count" id="s-count"></span>
    </div>
    <aside class="side">
      <div class="top"><span class="k" id="v-day"></span>
        <button class="icon" id="v-close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <h2 id="v-title"></h2>
      <p class="note" id="v-note"></p>
      <div class="well"><span class="k">The prompt, as typed</span><pre id="v-prompt"></pre></div>
      <div class="made" id="v-made-box"><span class="k">How it was made</span><p id="v-made"></p><div class="tools" id="v-tools"></div></div>
      <div class="made" id="v-skills-box" hidden><span class="k">Skills used</span><div class="tools" id="v-skills"></div></div>
      <div class="row">
        <button class="btn go" id="v-copy">Copy the prompt</button>
        <a class="btn ghost" id="v-dl" download>Download poster</a>
        <a class="btn ghost" id="v-dl2" download hidden>Download still</a>
      </div>
      <div class="share" id="share"></div>
    </aside>
  </div>
</dialog>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/Draggable.min.js"></script>
<script src="vendor/InertiaPlugin.min.js"></script>
<script src="vendor/tool-icons.js"></script>
<script src="site.config.js"></script>
<script src="data/posters.js"></script>
<script>if (/[?&]demo\b/.test(location.search)) document.write('<script src="demo/posters.js"><\/script>');</script>
<script>
(() => {
  gsap.registerPlugin(Draggable, InertiaPlugin);
  const S = window.SITE || {}, TOTAL = S.total || 30, DAY = 864e5, COLS = 6, ROWS = Math.ceil(TOTAL / COLS);
  const P = (window.POSTERS || []).slice().sort((a, b) => a.day - b.day);
  const byDay = Object.fromEntries(P.map(p => [p.day, p]));
  const L = P[P.length - 1];
  P.forEach(p => { const im = new Image(); im.onload = () => { try { const c = document.createElement('canvas'); c.width = c.height = 8; const g = c.getContext('2d');
    g.drawImage(im, 0, 0, 8, 8); const d = g.getImageData(0, 0, 8, 8).data; let l = 0; for (let i = 0; i < d.length; i += 4) l += .2126 * d[i] + .7152 * d[i + 1] + .0722 * d[i + 2];
    p.dark = l / 64 < 110; } catch {} }; im.src = p.thumb; });
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
  const $ = id => document.getElementById(id);

    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1); });
  // ---------- Share: a composed card that points people at Instagram ----------
  const IG = (S.instagram || '').replace(/^@/, ''), AT = '@' + IG;
  const STYLE = (new URLSearchParams(location.search).get('share')) || S.share || 'quick';
  const pageUrl = p => window.DEMO ? `${location.origin}/?demo#day-${pad(p.day)}` : `${(S.url || location.origin + '/').replace(/\/?$/, '/')}d/${pad(p.day)}`;
  const icon = slug => TI.paths[slug] ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="${TI.paths[slug]}"/></svg>` : '';
  const L_ICON = { link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
    dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 10l5 5 5-5M5 21h14"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v13M16 6l-4-4-4 4M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/></svg>' };
  const caption = (p, kind) => kind === 'prompt'
    ? `Day ${pad(p.day)} of ${AT}'s 30 day poster challenge. 60 seconds of prompt, posted as is.\n\nThe prompt:\n"${p.prompt}"\n\nMy go at it. Your turn, tag ${AT}.\n${pageUrl(p)}`
    : `Day ${pad(p.day)} of 30: ${p.title} by ${AT}. One prompt, 60 seconds, made in Claude Code and posted as is.\n\nSteal the prompt: ${pageUrl(p)}`;

  // drawing the card: Blame Opal frame, paper tiles on black seams, 10px corners at 1x (30 at 3x)
  const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
  const rr = (g, x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
  function wrap(g, text, x, y, maxW, lh, maxLines) {
    const words = String(text).split(/\s+/); let line = '', n = 0;
    for (let i = 0; i < words.length; i++) {
      const test = line ? line + ' ' + words[i] : words[i];
      if (g.measureText(test).width > maxW && line) { if (n === maxLines - 1) { g.fillText(line + '…', x, y + n * lh); return n + 1; } g.fillText(line, x, y + n * lh); n++; line = words[i]; }
      else line = test;
    }
    if (line) { g.fillText(line, x, y + n * lh); n++; } return n;
  }
  async function makeCard(p, kind) {
    await document.fonts.load('600 40px "Instrument Sans"'); await document.fonts.load('500 40px "Instrument Sans"');
    const W = 1080, H = kind === 'story' ? 1920 : 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d'), INK = '#101010', OPAL = '#FAFAF4', RAISED = '#EEEEE7', SEC = 'rgba(16,16,16,.68)';
    const [poster, mark] = await Promise.all([loadImg(p.image), loadImg('system/assets/brand/bo-mark.svg')]);
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    const tile = (x, y, w, h, fill = OPAL) => { g.fillStyle = fill; rr(g, x, y, w, h, 30); g.fill(); };
    const posterIn = (x, y, w, h) => { const k = Math.min(w / poster.width, h / poster.height), pw = poster.width * k, ph = poster.height * k;
      const px = x + (w - pw) / 2, py = y + (h - ph) / 2; g.save(); g.shadowColor = 'rgba(0,0,0,.25)'; g.shadowBlur = 40; g.shadowOffsetY = 12; g.drawImage(poster, px, py, pw, ph); g.restore(); return [px, py, pw, ph]; };
    const lockup = (x, y, col = INK) => { const mh = 30, mw = mark.width * mh / mark.height; g.save(); if (col !== INK) g.filter = 'invert(1)'; g.drawImage(mark, x, y, mw, mh); g.restore();
      g.fillStyle = col; g.font = '600 36px "Instrument Sans"'; g.textBaseline = 'middle'; g.fillText('blame opal', x + mw + 14, y + mh / 2 + 1); g.textBaseline = 'alphabetic'; };
    const pill = (text, x, y, fill, col, size = 36) => { g.font = `500 ${size}px "Instrument Sans"`; const w = g.measureText(text).width + size * 1.2, h = size * 1.9;
      g.fillStyle = fill; rr(g, x, y, w, h, h / 2); g.fill(); g.fillStyle = col; g.textBaseline = 'middle'; g.fillText(text, x + size * .6, y + h / 2 + 1); g.textBaseline = 'alphabetic'; return w; };
    const S6 = 6;
    if (kind === 'quick') {
      tile(S6, S6, W - 2 * S6, 108); lockup(48, 45); g.fillStyle = SEC; g.font = '500 32px "Instrument Sans"'; g.textAlign = 'right'; g.fillText(`Day ${pad(p.day)} of 30`, W - 48, 70); g.textAlign = 'left';
      tile(S6, 120, W - 2 * S6, H - 120 - 210, '#E1E1D9'); posterIn(S6 + 70, 170, W - 2 * S6 - 140, H - 120 - 210 - 100);
      tile(S6, H - 204, W - 2 * S6, 198); g.fillStyle = INK; g.font = '600 64px "Instrument Sans"'; g.fillText(p.title, 48, H - 104, W - 420);
      g.fillStyle = SEC; g.font = '400 30px "Instrument Sans"'; g.fillText('One prompt. 60 seconds. Posted as is.', 48, H - 52);
      g.font = '500 36px "Instrument Sans"'; const tw = g.measureText(AT).width + 43; pill(AT, W - 48 - tw, H - 152, INK, OPAL);
    } else if (kind === 'story') {
      tile(S6, 216, W - 2 * S6, 1290, '#E1E1D9'); const [px, py, pw, ph] = posterIn(80, 260, W - 160, 1200);
      g.font = '500 44px "Instrument Sans"'; const tw = g.measureText(AT).width + 53; pill(AT, px + pw - tw - 24, py + ph - 110, INK, OPAL, 44);
      tile(S6, 1512, W - 2 * S6, 108 + 0, OPAL); lockup(48, 1551); g.fillStyle = SEC; g.font = '500 32px "Instrument Sans"'; g.textAlign = 'right'; g.fillText(`Day ${pad(p.day)} of 30`, W - 48, 1576); g.textAlign = 'left';
      g.fillStyle = OPAL; g.font = '600 60px "Instrument Sans"'; g.fillText(p.title, 48, 140, W - 96);
      g.fillStyle = 'rgba(250,250,244,.62)'; g.font = '500 32px "Instrument Sans"';
      g.fillText(`Thirty posters by ${AT}`, 48, 1690);
    } else {
      tile(S6, S6, W - 2 * S6, H - 2 * S6 - 216); g.fillStyle = SEC; g.font = '500 32px "Instrument Sans"'; g.fillText(`Day ${pad(p.day)} prompt, as typed in 60 seconds`, 60, 96);
      g.fillStyle = INK; g.font = '600 58px "Instrument Sans"';
      const lines = wrap(g, `“${p.prompt}”`, 60, 200, W - 120, 70, 11);
      g.fillStyle = SEC; g.font = '500 32px "Instrument Sans"'; g.fillText(`Prompt by ${AT}`, 60, 200 + lines * 70 + 30);
      tile(S6, H - 204, W - 2 * S6, 198); g.save(); rr(g, 36, H - 180, 106, 150, 12); g.clip(); g.drawImage(poster, 36, H - 180, 106, 150); g.restore();
      g.fillStyle = INK; g.font = '600 44px "Instrument Sans"'; g.fillText('Make your own. Tag me.', 172, H - 112);
      g.font = '500 36px "Instrument Sans"'; pill(AT, 172, H - 88, INK, OPAL, 30);
      lockup(W - 300, H - 130);
    }
    return new Promise(ok => c.toBlob(ok, 'image/png'));
  }
  const toClip = async (t, btn, done) => { try { await navigator.clipboard.writeText(t); } catch { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
    if (btn) { const o = btn.innerHTML; btn.innerHTML = done; setTimeout(() => { btn.innerHTML = o; }, 1600); } };
  async function shareCard(p, kind, btn) {
    const blob = await makeCard(p, kind), file = new File([blob], `day-${pad(p.day)}-${kind}.png`, { type: 'image/png' }), text = caption(p, kind);
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    // desktop: download the card, copy the caption, then post it from the phone or the Instagram app
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toClip(text, btn, `${L_ICON.copy}Card saved, caption copied`);
  }
  async function renderShare(p) {
    const box = $('share'), kind = STYLE, u = encodeURIComponent(pageUrl(p)), t = encodeURIComponent(caption(p, 'quick'));
    const head = { quick: ['Share it', `Every share points at ${AT} on Instagram.`],
      story: ['Put it on your story', `A ready-made story card. Tag ${AT} and it gets reshared.`],
      prompt: ['Steal the prompt', `Make your own poster from it, post it, tag ${AT}. Best ones get reshared.`] }[kind];
    const plat = (cls, href, ico, label) => `<a class="plat${cls}" href="${href}" target="_blank" rel="noopener">${ico}${label}</a>`;
    const btn = (id, cls, ico, label) => `<button class="plat${cls}" id="${id}">${ico}${label}</button>`;
    let body = `<img class="card${kind === 'story' ? ' story' : ''}" id="sh-card" alt="Share card preview">`;
    if (kind === 'quick') body += `<div class="plats">${btn('sh-ig', ' wide', icon('instagram'), 'Instagram')}${plat('', `https://www.linkedin.com/sharing/share-offsite/?url=${u}`, icon('linkedin') || L_ICON.share, 'LinkedIn')}${plat('', `https://x.com/intent/post?text=${t}`, icon('x'), 'X')}${plat('', `https://www.threads.net/intent/post?text=${t}`, icon('threads'), 'Threads')}${plat('', `https://wa.me/?text=${t}`, icon('whatsapp'), 'WhatsApp')}${btn('sh-link', '', L_ICON.link, 'Copy link')}${btn('sh-dl', '', L_ICON.dl, 'Card')}</div><span class="tip">Instagram: on a phone it opens your share sheet. On a computer the card saves and the caption copies.</span>`;
    if (kind === 'story') body += `<div class="plats">${btn('sh-ig', ' wide', icon('instagram'), 'Share to your story')}${btn('sh-dl', '', L_ICON.dl, 'Card')}${btn('sh-cap', '', L_ICON.copy, 'Caption')}${btn('sh-link', '', L_ICON.link, 'Link')}</div><span class="tip">Add a mention sticker for ${AT} so it lands in the reshare pile.</span>`;
    if (kind === 'prompt') body += `<div class="plats">${btn('sh-cap', ' wide', L_ICON.copy, 'Copy prompt and caption')}${btn('sh-ig', '', icon('instagram'), 'Share')}${btn('sh-dl', '', L_ICON.dl, 'Card')}${btn('sh-link', '', L_ICON.link, 'Link')}</div>`;
    box.innerHTML = `<div class="head"><h3>${head[0]}</h3></div><p>${head[1]}</p>${body}`;
    const card = kind === 'quick' ? 'quick' : kind;
    makeCard(p, card).then(b => { const im = $('sh-card'); if (im && P[ci] === p) { if (im._u) URL.revokeObjectURL(im._u); im._u = im.src = URL.createObjectURL(b); } }).catch(() => {});
    const on = (id, f) => { const el = $(id); if (el) el.onclick = e => f(e.currentTarget); };
    on('sh-ig', b => shareCard(p, card, b));
    on('sh-dl', async b => { const blob = await makeCard(p, card); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `day-${pad(p.day)}-${card}.png`; a.click(); });
    on('sh-cap', b => toClip(caption(p, kind), b, `${L_ICON.copy}Copied`));
    on('sh-link', b => toClip(pageUrl(p), b, `${L_ICON.link}Copied`));
  }

  $('v-copy').onclick = async e => {
    const btn = e.currentTarget, text = P[ci].prompt;
    try { await navigator.clipboard.writeText(text); }
    catch { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    btn.textContent = 'Copied. It’s yours.';
    if (!reduce) gsap.fromTo(btn, { scale: .96 }, { scale: 1, duration: .2 });
  };
  const fromHash = () => { const m = location.hash.match(/^#day-(\d{2})$/); if (m) open(+m[1], null); };
  addEventListener('hashchange', fromHash);

  // ---------- Intro: sixty seconds, once per visit ----------
  let seen = false; try { seen = sessionStorage.getItem('tp-intro') === '1'; sessionStorage.setItem('tp-intro', '1'); } catch {}
  const huds = ['.hud.tl', '.hud.tr', '.hud.bl', '.hud.br', '#hint', '.hud.zoom'];
  function enter() {
    const vis = blocks.flatMap(b => [...b.el.children]).filter(el => {
      const r = el.getBoundingClientRect(); return r.right > 0 && r.bottom > 0 && r.left < innerWidth && r.top < innerHeight; })
      .map(el => ({ el, r: el.getBoundingClientRect() })).sort((a, b) => (a.r.top - b.r.top) || (a.r.left - b.r.left)).map(o => o.el);
    return gsap.timeline({ onComplete: fromHash })
      .fromTo(vis, { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: .56, stagger: { amount: Math.min(1.4, vis.length * .07) }, clearProps: 'opacity,visibility,transform' })
      .fromTo(huds, { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: .56, stagger: .07, clearProps: 'transform' }, '-=.6');
  }
  if (reduce) { $('intro').remove(); fromHash(); }
  else if (seen) { $('intro').remove(); enter(); }
  else {
    gsap.set(huds, { autoAlpha: 0 });
    const n = { v: 60 };
    gsap.timeline()
      .to(n, { v: 0, duration: 1.2, ease: 'none', onUpdate: () => { $('intro-n').textContent = pad(Math.round(n.v)); } })
      .to('#intro', { yPercent: -100, duration: .56, onComplete: () => $('intro').remove() }, '+=.2')
      .add(() => enter(), '-=.3');
  }
})();
</script>
